# Production stack for a single VPS: Caddy (HTTPS, web, /api proxy), API, PostgreSQL and daily backups.
# Run from infra/production with an .env file next to this one (see .env.example).
name: retail
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: retail
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U retail -d retail']
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: retail-api:latest
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    command: [migrate]
    environment: &api-environment
      DATABASE_URL: postgres://retail:${POSTGRES_PASSWORD}@db:5432/retail?sslmode=disable
      WEB_ORIGIN: https://${DOMAIN:?set DOMAIN in .env}${PUBLIC_PORT_SUFFIX:-}
      COOKIE_SECURE: "true"
      TRUSTED_PROXIES: 172.30.0.0/24,fd72:6574:6169::/64
    networks: [internal]
    depends_on:
      db:
        condition: service_healthy

  api:
    image: retail-api:latest
    pull_policy: never
    restart: unless-stopped
    environment: *api-environment
    networks:
      internal:
        ipv4_address: 172.30.0.20
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, retail, healthcheck]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    image: retail-web:latest
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      LEGACY_DOMAIN: ${LEGACY_DOMAIN:-http://legacy.invalid}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - /opt/caddy-sites:/etc/caddy/sites:ro
    networks: [internal, edge]
    depends_on:
      api:
        condition: service_healthy

  backup:
    image: postgres:17
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: retail
      PGDATABASE: retail
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ${BACKUP_DIR:-/var/backups/retail}:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: [sh, /backup.sh]
    networks: [internal]
    depends_on:
      migrate:
        condition: service_completed_successfully

networks:
  internal:
    # IPv6 lets Docker NAT IPv6 clients straight to Caddy; without it docker-proxy relays them and
    # every IPv6 visitor would reach the API with the same internal address.
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
        - subnet: fd72:6574:6169::/64

  edge:
    # Red compartida con otros sistemas del VPS a los que este Caddy les pone el HTTPS. La crea deploy.sh.
    name: rumbo-edge
    external: true

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
