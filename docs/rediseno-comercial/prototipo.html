<aside><div class="logo">retail<span>•</span></div><div class="workspace"><b>Casa Oliva</b>Indumentaria & accesorios</div><nav id="desktop-nav"></nav><div class="side-bottom"><a href="#gestion">⚙ <span>Configuración y gestión</span></a><div class="actions" style="padding:16px 12px 0"><span class="avatar">ML</span><div><b style="font-size:12px">María López</b><br><small style="color:#b5cabe">Propietaria · Casa Oliva</small></div></div></div></aside>
<div class="main-wrap"><header class="topbar"><div class="context"><b id="context-label">Productos</b><span class="prototype">Prototipo interactivo</span></div><div class="context"><label class="store"><span class="small">Sucursal</span><select id="store" aria-label="Sucursal activa"><option>Palermo</option><option>Belgrano</option></select></label><span class="avatar" aria-label="María López">ML</span></div></header><div class="notice-strip">Simulación de diseño · Datos ficticios en memoria · Recargar reinicia la experiencia</div><main class="content" id="main" tabindex="-1"></main></div></div>

<dialog id="modal"><div class="dialog-head"><h2 id="modal-title"></h2><button type="button" class="quiet" aria-label="Cerrar diálogo" onclick="closeModal()">✕</button></div><div class="dialog-body" id="modal-body"></div><div class="dialog-foot" id="modal-foot"></div></dialog>
<script>
'use strict';
const $=(s)=>document.querySelector(s), $$=(s)=>[...document.querySelectorAll(s)];
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=(c)=>'ARS '+new Intl.NumberFormat('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(c/100);
const parseMoney=v=>{let s=String(v).trim().replace(',','.');return /^\d+(\.\d{1,2})?$/.test(s)?Math.round(Number(s)*100):null};
const sizes=['XS','S','M','L','XL'], colors=['Crudo','Negro','Oliva'], fabrics={'Crudo':'#d0c6ad','Negro':'#41483f','Oliva':'#7a8867'};
let next=41,selected='p1',tab='general',catalogSearch='',catalogFilter='all',categoryFilter='',page=1,posSearch='',scenario='normal',loadState='ready',priceFault=false,stockFault=false,photoURL='',generalDirty=false,formDraft={},preview=[],selection={sizes:['S','M','L'],colors:['Crudo','Negro']},variantDraft=false;
let products=[
{id:'p1',name:'Remera esencial de algodón',category:'Remeras',brand:'Oliva Studio',description:'Algodón suave de corte relajado. Una prenda para todos los días.',active:true,fabric:'#9aab8b',vars:[v('S','Crudo',28900,8),v('M','Crudo',28900,12),v('L','Crudo',28900,5),v('M','Negro',28900,7)]},
{id:'p2',name:'Camisa de lino · edición natural',category:'Camisas',brand:'Oliva Studio',description:'Lino de trama abierta.',active:true,fabric:'#b5aa8c',vars:[v('S','Crudo',null,4),v('M','Crudo',null,6)]},
{id:'p3',name:'Pantalón sastrero recto',category:'Pantalones',brand:'Sur',description:'Calce recto.',active:true,fabric:'#636f64',vars:[v('M','Negro',64900,0)]},
{id:'p4',name:'Buzo de algodón orgánico',category:'Buzos',brand:'Oliva Studio',description:'Nueva colección.',active:true,fabric:'#b7b7a4',vars:[]},
{id:'p5',name:'Remera rayada de temporada anterior',category:'Remeras',brand:'Sur',description:'Colección anterior.',active:false,fabric:'#a09b8e',vars:[v('L','Oliva',19900,3)]},
{id:'p6',name:'Campera liviana con capucha y bolsillos interiores',category:'Abrigos',brand:'Sur',description:'Colección otoño.',active:true,fabric:'#7e8975',unknown:true,vars:[v('M','Oliva',79900,2)]}
];
function v(size,color,amount,qty){let n=next++;return{id:'v'+n,size,color,sku:String(n).padStart(6,'0'),code:'000'+String(100000+n),active:true,prices:{Palermo:amount===null?null:amount*100,Belgrano:amount===null?null:(amount+1500)*100},stock:{Palermo:{Salón:qty,Depósito:0},Belgrano:{Salón:2,Depósito:0}}}}
products[0].vars[3].active=false;
let cart=[],sales=[],pendingSale=null,cashOpen=true,savedPrice={},lineNotes={},lastRoute='',modalOpener=null,busy=false,operation=0;
const store=()=>$('#store').value, prod=()=>products.find(p=>p.id===selected), stock=(x,s=store())=>x.active?(x.stock[s]?.Salón??null):0, price=x=>x.prices[store()], allVars=()=>products.flatMap(p=>p.vars.map(x=>({p,x})));
const icons={inicio:'◫',productos:'▦',vender:'＋',inventario:'▤',clientes:'♧',gestion:'◷'};
const navNames={inicio:'Inicio',productos:'Productos',vender:'Vender',inventario:'Inventario',clientes:'Clientes',gestion:'Gestión'};
function btn(t,a,cls='',attrs=''){return '<button type="button" class="'+cls+'" '+attrs+' onclick="'+a+'">'+t+'</button>'}
function pill(t,c=''){return '<span class="pill '+c+'"><span class="dot"></span>'+t+'</span>'}
function thumb(p,wide=false){if(p.photo)return '<div class="thumb '+(wide?'wide':'')+'"><img src="'+esc(p.photo)+'" alt="'+esc(p.name)+'" style="width:100%;height:100%;object-fit:contain"></div>';return '<div class="thumb '+(wide?'wide':'')+'" aria-hidden="true" style="--fabric:'+p.fabric+'"><div class="garment"></div></div>'}
function crumb(s){return '<div class="crumb"><a class="page-back" href="#productos">Productos</a><span> / </span>'+esc(s)+'</div>'}
function head(t,d,actions=''){return '<div class="pagehead"><div><h1>'+t+'</h1><p>'+d+'</p></div><div class="actions">'+actions+'</div></div>'}
function notify(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('#toast').classList.add('hidden'),4500)}
function go(route){if(location.hash.slice(1)===route)render();else location.hash=route}
function showModal(title,body,foot){modalOpener=document.activeElement;$('#modal-title').textContent=title;$('#modal-body').innerHTML=body;$('#modal-foot').innerHTML=foot;$('#modal').setAttribute('aria-labelledby','modal-title');$('#modal').showModal();requestAnimationFrame(()=>($('#modal-body').querySelector('input,select,button')||$('#modal-foot').querySelector('button'))?.focus())}
function closeModal(){if(busy)return;$('#modal').close();modalOpener?.isConnected&&modalOpener.focus()}
$('#modal').addEventListener('cancel',e=>{if(busy)e.preventDefault()});
$('#modal').addEventListener('close',()=>{modalOpener?.isConnected&&modalOpener.focus()});
function asyncAction(action,label='Guardando…'){if(busy)return;busy=true;const op=++operation;const buttons=$$('#modal[open] button');buttons.forEach(b=>b.disabled=true);notify(label);setTimeout(()=>{if(op!==operation)return;busy=false;action()},450)}
function activeRoute(){return location.hash.slice(1)||'productos'}
function render(){let route=activeRoute(),base=['crear','ficha','detalle'].includes(route)?'productos':route==='historial'?'vender':route==='resultado'?'vender':route;
if(!navNames[base])base='gestion';
$('#context-label').textContent=navNames[base];
$('#desktop-nav').innerHTML=Object.keys(navNames).map(k=>'<a href="#'+k+'" '+(base===k?'class="active" aria-current="page"':'')+'><span class="nav-icon" aria-hidden="true">'+icons[k]+'</span>'+navNames[k]+'</a>').join('');
$('#mobile-nav').innerHTML=['inicio','vender','productos','inventario','gestion'].map(k=>'<a href="#'+k+'" '+(base===k?'class="active" aria-current="page"':'')+'><span class="nav-icon" aria-hidden="true">'+icons[k]+'</span>'+(k==='gestion'?'Más':navNames[k])+'</a>').join('');
let html=route==='productos'?catalog():route==='crear'?editor(true):route==='ficha'?editor(false):route==='detalle'?detail():route==='vender'?pos():route==='resultado'?result():route==='historial'?salesHistory():route==='inicio'?home():route==='inventario'?inventory():route==='clientes'?clients():management();
if(route==='vender'&&cart.length)html+='<div class="mobile-cart-cta"><div><small style="color:#d8e5d5">'+cart.reduce((s,l)=>s+l.qty,0)+' artículos</small><br><b>'+money(cart.reduce((s,l)=>s+lineTotal(l),0))+'</b></div>'+btn('Ver venta ↓',"document.querySelector('.cart').scrollIntoView({block:'start',behavior:'smooth'})")+'</div>';
$('#main').innerHTML=html;
if(route!==lastRoute){window.scrollTo(0,0);lastRoute=route}
}
function prep(p){if(p.unknown)return ['Consulta pendiente','unknown'];if(!p.active)return ['Inactivo',''];if(!p.vars.length)return ['Sin variantes','warn'];if(p.vars.some(x=>price(x)===null))return ['Falta precio','warn'];if(!p.vars.some(x=>(stock(x)??0)>0))return ['Sin stock vendible',''];return ['Datos completos','good']}
function catalog(){
let filtered=products.filter(p=>(p.name+' '+p.vars.map(x=>x.sku).join(' ')).toLowerCase().includes(catalogSearch.toLowerCase())&&(!categoryFilter||p.category===categoryFilter)&&(catalogFilter==='all'||(catalogFilter==='incomplete'&&prep(p)[1]!=='good')||(catalogFilter==='active'&&p.active)||(catalogFilter==='inactive'&&!p.active)));
let counts={active:products.filter(p=>p.active).length,ready:products.filter(p=>prep(p)[1]==='good').length};
let rows=filtered.map(p=>{let [s,c]=prep(p),prices=p.vars.map(price).filter(n=>n!==null),qty=p.active?p.vars.reduce((a,x)=>a+(stock(x)??0),0):0;return '<article class="productrow"><div class="productcell">'+thumb(p)+'<div><b>'+esc(p.name)+'</b><small>'+esc(p.category||'Sin categoría')+' · '+esc(p.brand||'Sin marca')+'</small><small>'+p.vars.length+' variantes</small></div></div><div class="labelcell pricecell"><span class="rowlabel">Precio · '+store()+'</span><strong>'+(p.unknown?'No disponible':prices.length?money(Math.min(...prices)):'Sin precio')+'</strong><small>'+(prices.length?'Desde · lista General':'Pendiente de configurar')+'</small></div><div class="labelcell stockcell"><span class="rowlabel">Disponibilidad</span><strong>'+(p.unknown?'Desconocida':qty+' unidades')+'</strong><small>En salón · '+store()+'</small></div><div class="rowstate">'+pill(s,c)+'</div><div class="rowaction">'+btn(c==='good'?'Ver producto →':'Continuar →',"openProduct('"+p.id+"','"+(c==='good'?'detalle':'ficha')+"')",'linkbtn')+'</div></article>'}).join('');
return head('Productos','Tu colección, sus precios y su disponibilidad en un mismo lugar.',btn('⌁ Escanear','scanModal()','')+btn('＋ Crear producto',"newProduct()",'primary'))+
'<div class="stats"><div class="stat"><small>Productos</small><strong>'+products.length+'</strong><small>En tu catálogo</small></div><div class="stat"><small>Activos</small><strong>'+counts.active+'</strong><small>Visibles en consultas</small></div><div class="stat"><small>Con datos completos</small><strong>'+counts.ready+'</strong><small>En '+store()+'</small></div><div class="stat"><small>Para continuar</small><strong>'+(products.length-counts.ready)+'</strong><small>Revisar preparación</small></div></div>'+
'<section class="panel" aria-label="Listado de productos"><div class="filterbar"><label class="searchbox"><span aria-hidden="true">⌕</span><input id="catalog-q" aria-label="Buscar por nombre o SKU" placeholder="Buscar por nombre o SKU…" value="'+esc(catalogSearch)+'" oninput="searchCatalog(this)"></label><select aria-label="Estado de preparación" onchange="catalogFilter=this.value;render()">'+[['all','Todos los estados'],['incomplete','Para continuar'],['active','Activos'],['inactive','Inactivos']].map(([a,b])=>'<option value="'+a+'" '+(catalogFilter===a?'selected':'')+'>'+b+'</option>').join('')+'</select><select aria-label="Categoría" onchange="categoryFilter=this.value;render()"><option value="">Todas las categorías</option>'+[...new Set(products.map(p=>p.category).filter(Boolean))].map(c=>'<option '+(categoryFilter===c?'selected':'')+'>'+esc(c)+'</option>').join('')+'</select></div>'+
(loadState==='error'?'<div class="empty"><h2>No pudimos consultar el catálogo</h2><p>Tu búsqueda se conserva. La disponibilidad todavía no está confirmada.</p>'+btn('Reintentar lectura',"loadState='ready';render()", 'primary')+'</div>':loadState==='loading'?'<div class="loading" role="status">Consultando productos…<div class="skeleton"></div><div class="skeleton"></div></div>':'<div class="tablehead"><span>Producto / clasificación</span><span>Precio de sucursal</span><span>Stock vendible</span><span>Preparación</span><span></span></div>'+(rows||'<div class="empty"><div class="symbol">⌕</div><h2>No encontramos productos</h2><p>Probá con otro nombre o ajustá los filtros.</p>'+btn('Limpiar filtros',"catalogSearch='';categoryFilter='';catalogFilter='all';render()")+'</div>'))+
'<div class="listfoot"><span>'+filtered.length+' productos · datos de demostración</span><div class="actions"><button disabled>← Anterior</button><span>Página 1</span><button disabled>Siguiente →</button></div></div></section>'+
'<p class="footnote">Los datos completos describen esta consulta. El punto de venta valida precio, disponibilidad y caja al confirmar.</p><details class="status-demo"><summary>Escenarios de revisión del diseño</summary><div class="actions">'+btn('Error de lectura',"loadState='error';render()")+btn('Cargando',"loadState='loading';render();setTimeout(()=>{loadState='ready';render()},1400)")+btn('Restablecer',"loadState='ready';render()")+'</div></details>';
}
function searchCatalog(el){let start=el.selectionStart;catalogSearch=el.value;render();let n=$('#catalog-q');n.focus();n.setSelectionRange(start,start)}
function newProduct(){selected=null;tab='general';formDraft={};generalDirty=false;preview=[];go('crear')}
function openProduct(id,route='ficha'){selected=id;tab='general';formDraft={};generalDirty=false;preview=[];variantDraft=false;go(route)}
function setTab(t){tab=t;render()}
function editor(isNew){
let p=prod(),name=p?.name||'Nuevo producto';if(!isNew&&!p){go('productos');return ''}
let current=formDraft.name===undefined?{name:p?.name||'',description:p?.description||'',category:p?.category||'',brand:p?.brand||'',active:p?.active??true}:formDraft;
let tabs=[['general','Datos generales'],['variantes','Variantes'],['precios','Precios'],['stock','Mercadería'],['resumen','Resumen']];
let section=tab==='general'?generalForm(current,isNew):tab==='variantes'?variants(p):tab==='precios'?pricesView(p):tab==='stock'?stockView(p):summaryView(p);
return crumb(isNew?'Crear producto':name)+head(isNew?'Crear producto':esc(name),isNew?'Empezá por lo esencial. Podés completar el resto cuando quieras.':'Ficha de producto · '+store(),(!isNew?btn('Vista del producto',"go('detalle')"):'')+(!isNew?pill(p.active?'Activo':'Inactivo',p.active?'good':''):''))+
'<div class="tabs" role="tablist" aria-label="Secciones del producto">'+tabs.map(([id,t])=>'<button role="tab" aria-selected="'+(tab===id)+'" '+(isNew&&id!=='general'?'disabled':'')+' onclick="setTab(\''+id+'\')">'+t+(id==='variantes'&&p?'<span class="n">'+p.vars.length+'</span>':'')+'</button>').join('')+'</div><div class="split"><div>'+section+'</div><div class="prep-side">'+prepSidebar(p)+
'<div class="helpblock"><h3>Una ficha, todo el recorrido</h3><p>Guardá los datos generales y continuá con variantes, precios y mercadería. Cada operación conserva su confirmación.</p></div></div></div>';
}
function prepSidebar(p){let rows=[['Datos generales',!!p,'Nombre y clasificación','general'],['Variantes',!!p?.vars.length,p?.vars.length?p.vars.length+' combinaciones creadas':'Talles, colores e identificadores','variantes'],['Precios de '+store(),!!p?.vars.length&&p.vars.every(x=>price(x)!==null),'Por variante y lista aplicable','precios'],['Mercadería',!!p?.vars.some(x=>(stock(x)??0)>0),'Stock de ubicaciones vendibles','stock']];
return '<section class="panel prep"><h3>Preparación en '+store()+'</h3>'+rows.map(([t,ok,d,k])=>'<div class="checkline"><span class="checkicon '+(ok?'done':'')+'" aria-hidden="true">'+(ok?'✓':'○')+'</span><div><b>'+t+'</b><p>'+d+'</p></div></div>').join('')+(p?'<div style="padding-top:16px">'+btn('Ver resumen →',"setTab('resumen')",'linkbtn')+'</div>':'')+'</section>'}
function generalForm(f,isNew){return '<form id="general-form" class="panel" onsubmit="saveGeneral(event)" oninput="captureGeneral()"><div class="form-section"><h2>Información del producto</h2><p>El nombre es obligatorio. Los demás datos te ayudan a organizar el catálogo.</p><div class="formgrid"><label class="full">Nombre del producto <span class="field-help">Obligatorio</span><input name="name" required maxlength="160" value="'+esc(f.name)+'" placeholder="Ej. Remera de algodón cuello redondo"></label><label class="full">Descripción <span class="field-help">Opcional</span><textarea name="description" maxlength="2000" placeholder="Material, calce y detalles que identifican la prenda…">'+esc(f.description)+'</textarea></label><label>Categoría <select name="category"><option value="">Sin categoría</option>'+['Remeras','Camisas','Pantalones','Buzos','Abrigos'].map(c=>'<option '+(f.category===c?'selected':'')+'>'+c+'</option>').join('')+'</select></label><label>Marca <input name="brand" value="'+esc(f.brand)+'" placeholder="Opcional"></label></div></div><div class="form-section"><h2>Imágenes</h2><p>Opcionales. Ayudan a encontrar el producto en el catálogo.</p><div class="photo-upload"><label>Seleccionar imagen<input type="file" accept="image/*" onchange="previewPhoto(this)"></label><div id="photo-preview" class="file-preview">'+(photoURL?'<img src="'+photoURL+'" alt="Imagen seleccionada para la simulación"><small>Vista local · no se sube a un servidor</small>':'<small>La imagen se usa sólo en esta sesión de demostración.</small>')+'</div></div></div><div class="form-section"><label>Estado<select name="active"><option value="true" '+(f.active?'selected':'')+'>Activo</option><option value="false" '+(!f.active?'selected':'')+'>Inactivo</option></select></label><p class="field-help" style="margin-top:8px">Activo permite consultar el producto. Precio, stock y caja se validan por separado.</p><div id="general-error" role="status"></div></div><div class="toolbar"><small>'+(generalDirty?'Cambios locales sin guardar':'Podés continuar la preparación después')+'</small><button type="submit" class="primary">'+(isNew?'Guardar producto':'Guardar cambios')+' →</button></div></form>'}
function captureGeneral(){let f=$('#general-form');formDraft={name:f.elements.namedItem('name').value,description:f.elements.namedItem('description').value,category:f.elements.namedItem('category').value,brand:f.elements.namedItem('brand').value,active:f.elements.namedItem('active').value==='true'};generalDirty=true}
function previewPhoto(input){const file=input.files[0];if(!file)return;if(!file.type.startsWith('image/')){$('#photo-preview').innerHTML='<span class="inline-error">Seleccioná un archivo de imagen.</span>';return}if(photoURL)URL.revokeObjectURL(photoURL);photoURL=URL.createObjectURL(file);$('#photo-preview').innerHTML='<img src="'+photoURL+'" alt="Vista local de la imagen seleccionada"><small>'+esc(file.name)+' · vista local</small>';generalDirty=true}
function saveGeneral(e){e.preventDefault();captureGeneral();if(!formDraft.name.trim()){$('#general-error').innerHTML='<p class="inline-error">Ingresá el nombre del producto.</p>';return}
let n=formDraft.name.trim();asyncAction(()=>{if(!selected){let id='p'+Date.now();products.unshift({id,name:n,description:formDraft.description,category:formDraft.category,brand:formDraft.brand,active:formDraft.active,fabric:'#9ba68d',vars:[]});selected=id}else Object.assign(prod(),formDraft,{name:n});if(photoURL)prod().photo=photoURL;formDraft={};generalDirty=false;go('ficha');render();notify('Producto guardado en la simulación. Podés continuar con sus variantes.')})}
function variants(p){
let generated=preview.length>0;let body='<div class="panel"><div class="form-section"><h2>Talles y colores</h2><p>Elegí los valores de tu catálogo para generar combinaciones. También podés usar sólo talle, sólo color o ninguno.</p><h3>Talles</h3><div class="choices">'+sizes.map(s=>'<label class="choice"><input type="checkbox" value="'+s+'" '+(selection.sizes.includes(s)?'checked':'')+' onchange="selectMaster(\'sizes\',this)">'+s+'</label>').join('')+'</div><h3>Colores</h3><div class="choices">'+colors.map(c=>'<label class="choice"><input type="checkbox" value="'+c+'" '+(selection.colors.includes(c)?'checked':'')+' onchange="selectMaster(\'colors\',this)"><span class="swatch" style="background:'+fabrics[c]+'"></span>'+c+'</label>').join('')+'</div><div class="actions"><span class="pill">'+Math.max(1,selection.sizes.length)*Math.max(1,selection.colors.length)+' combinaciones posibles</span>'+btn(generated?'Actualizar previsualización':'Previsualizar combinaciones','generatePreview()','primary')+'</div><p class="footnote">Hasta 50 variantes seleccionadas por operación. Previsualizar no crea variantes ni reserva los SKU.</p></div></div>';
if(generated){let included=preview.filter(x=>!x.exclude);body+='<section class="panel" style="margin-top:20px"><div class="sectionhead"><h2>Revisar combinaciones</h2><span class="pill">'+included.length+' seleccionadas</span></div><div class="matrix-wrap"><table class="data-table"><thead><tr><th>Incluir</th><th>Variante</th><th>SKU sugerido</th><th>Código interno</th><th>Estado</th></tr></thead><tbody>'+preview.map((x,i)=>'<tr><td data-label="Incluir"><input aria-label="Incluir '+esc(x.size+' '+x.color)+'" type="checkbox" '+(!x.exclude?'checked':'')+' onchange="preview['+i+'].exclude=!this.checked;variantDraft=true;render()"></td><td data-label="Variante"><b>'+esc(x.size||'Sin talle')+' / '+esc(x.color||'Sin color')+'</b></td><td data-label="SKU"><input aria-label="SKU de '+esc(x.size+' '+x.color)+'" value="'+esc(x.sku)+'" onchange="preview['+i+'].sku=this.value;variantDraft=true;validatePreview();render()">'+(x.error?'<span class="row-error">'+esc(x.error)+'</span>':'')+'</td><td data-label="Código"><label class="checkgroup"><input type="checkbox" '+(x.internal?'checked':'')+' onchange="preview['+i+'].internal=this.checked;variantDraft=true">Generar al crear</label></td><td>'+pill(x.error?'Revisar':x.exclude?'Excluida':'Nueva',x.error?'bad':x.exclude?'':'good')+'</td></tr>').join('')+'</tbody></table></div><div class="toolbar"><small>SKU editable. La asignación definitiva se valida al crear.</small>'+btn('Crear '+included.length+' variantes','confirmVariants()','primary',included.length<1||included.length>50?'disabled':'')+'</div></section>'}
body+='<section class="panel" style="margin-top:20px"><div class="sectionhead"><h2>Variantes existentes</h2><span class="pill">'+p.vars.length+'</span></div>'+(p.vars.length?'<div class="matrix-wrap"><table class="data-table"><thead><tr><th>Variante</th><th>SKU</th><th>Código</th><th>Estado</th></tr></thead><tbody>'+p.vars.map(x=>'<tr><td data-label="Variante">'+esc(x.size||'Sin talle')+' · '+esc(x.color||'Sin color')+'</td><td data-label="SKU">'+esc(x.sku)+'</td><td data-label="Código">'+esc(x.code||'Sin código')+'</td><td>'+pill(x.active?'Activa':'Inactiva',x.active?'good':'')+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty"><div class="symbol">▦</div><h3>Todavía no hay variantes</h3><p>Seleccioná talles y colores arriba para preparar las combinaciones.</p></div>')+'</section>';return body}

function generatePreview(){let old=preview;preview=[];for(const s of selection.sizes.length?selection.sizes:[''])for(const c of selection.colors.length?selection.colors:['']){let previous=old.find(x=>x.size===s&&x.color===c);preview.push(previous||{size:s,color:c,sku:String(next+preview.length).padStart(6,'0'),internal:false,exclude:false})}variantDraft=true;validatePreview();render()}
function validatePreview(){let p=prod(),all=allVars();for(const x of preview){x.error='';if(x.exclude)continue;if(!x.sku.trim())x.error='El SKU es obligatorio.';else if(all.some(({x:v})=>v.sku.toLowerCase()===x.sku.trim().toLowerCase())||preview.some(y=>y!==x&&!y.exclude&&y.sku.trim().toLowerCase()===x.sku.trim().toLowerCase()))x.error='Este SKU ya está utilizado.';if(p.vars.some(v=>v.size===x.size&&v.color===x.color))x.error='Esta combinación ya existe, incluso si está inactiva.'}}
function confirmVariants(){validatePreview();let included=preview.filter(x=>!x.exclude);if(!included.length||included.length>50||included.some(x=>x.error)){render();notify('Revisá las combinaciones con error o excluilas.');return}showModal('Crear variantes','<p>Se crearán <b>'+included.length+' variantes</b> para '+esc(prod().name)+'.</p><p class="aside-note">La operación representa un lote completo. Si una combinación falla, ninguna se crea.</p>',btn('Seguir revisando','closeModal()')+btn('Confirmar creación','createVariants()','primary'))}

function stockView(p){if(!p.vars.length)return emptySection('Primero necesitás una variante','La mercadería se registra por variante y ubicación.',"setTab('variantes')",'Configurar variantes');return '<div class="infobar"><div><b>Registrar mercadería mediante un ajuste</b>Se comparará el saldo vigente antes de confirmar. Cada variante genera una operación trazable.</div></div><section class="panel panel-pad"><h2>Nueva operación · '+store()+'</h2><div class="formgrid"><label class="full">Variante<select id="stock-variant" onchange="updateBalance()">'+p.vars.map(x=>'<option value="'+x.id+'">'+esc(x.size||'Sin talle')+' · '+esc(x.color||'Sin color')+' — '+esc(x.sku)+'</option>').join('')+'</select></label><label>Ubicación<select id="stock-location" onchange="updateBalance()"><option>Salón</option><option>Depósito</option></select></label><div id="balance-info"><small>Saldo físico registrado</small><div class="big-num">'+(p.vars[0].stock[store()].Salón??'Sin saldo')+'</div><small>Salón es vendible · reservado 0 en esta simulación</small></div><label>Cantidad física final contada<input id="stock-qty" inputmode="numeric" type="number" min="0" step="1" placeholder="Ingresá la cantidad final" oninput="updateDelta()"></label><div id="delta-info"><small>Diferencia</small><p>Ingresá la cantidad para revisar.</p></div><label class="full">Motivo del ajuste<input id="stock-reason" required maxlength="300" placeholder="Ej. Carga inicial verificada en salón"></label></div><div class="actions" style="margin-top:22px">'+btn('Revisar ajuste','reviewStock()','primary')+'</div><p class="footnote">Depósito es no vendible en esta demostración. Su saldo físico no se ofrece en el POS.</p></section><details class="status-demo"><summary>Escenarios de revisión del diseño</summary><div class="actions">'+btn('Próximo ajuste con conflicto',"stockFault=true;notify('El próximo ajuste simulará un cambio concurrente de saldo.')")+'</div></details>'}

function scanPOS(){let code=$('#pos-code').value,m=allVars().find(({x})=>x.code===code);if(!m){$('#pos-scan-result').innerHTML='<p class="inline-error">Código inexistente. No encontramos una coincidencia exacta.</p>';return}if(!m.p.active||!m.x.active||m.p.unknown||price(m.x)===null||!(stock(m.x)>0)){$('#pos-scan-result').innerHTML='<p class="inline-error">Encontramos '+esc(m.p.name)+', pero necesitás revisar estado, precio o stock vendible.</p>';return}addCart(m.p.id,m.x.id)}
function checkout(){if(!cart.length||!cashOpen)return;let total=cart.reduce((s,l)=>s+lineTotal(l),0);showModal('Cobrar venta','<div class="total-line final" style="border:0;padding:0 0 20px"><span>Total a cobrar</span><span>'+money(total)+'</span></div><label>Cliente<select id="sale-customer"><option value="">Consumidor final</option><option>Ana García</option><option>Lucía Pérez</option></select></label><div class="formgrid" style="margin-top:18px"><label>Medio de pago<select id="payment" onchange="paymentChanged()"><option value="cash">Efectivo</option><option value="transfer">Transferencia</option><option value="debit">Débito</option><option value="credit">Tarjeta de crédito</option><option value="qr">QR</option><option value="mixed">Pago mixto</option><option value="fiado">Fiado</option></select></label><label id="cash-field">Efectivo recibido ARS<input id="received" inputmode="decimal" value="'+(total/100).toFixed(2)+'"></label></div><div id="payment-extra"></div><p class="footnote">Caja propia · '+store()+' · Ticket comercial interno</p><div id="checkout-error" role="status"></div>',btn('Volver al carrito','closeModal()')+btn('Confirmar venta','confirmSale()','primary'))}
function paymentChanged(){let p=$('#payment').value;$('#cash-field').hidden=p!=='cash'&&p!=='mixed';$('#payment-extra').innerHTML=p==='mixed'?'<div class="infobar" style="margin-top:15px"><div>El resto del total se registrará por transferencia.</div></div>':p==='fiado'?'<div class="infobar warn" style="margin-top:15px"><div>Seleccioná un cliente identificado. Esta simulación deja el total pendiente de cobro.</div></div>':''}
function confirmSale(){let total=cart.reduce((s,l)=>s+lineTotal(l),0),method=$('#payment').value,customer=$('#sale-customer').value,received=parseMoney($('#received').value);
let error=method==='fiado'&&!customer?'Seleccioná un cliente para registrar una venta fiada.':(method==='cash'&&(received===null||received<total))?'El efectivo recibido debe cubrir el total.':method==='mixed'&&(received===null||received<=0||received>=total)?'Ingresá la parte en efectivo, mayor a cero y menor al total.':!cashOpen?'La sesión de caja no está disponible.':cart.some(l=>!l.p.active||!l.x.active||price(l.x)===null||stock(l.x)<l.qty)?'Cambió la disponibilidad de una variante. Revisá el carrito.':'';
if(error){$('#checkout-error').innerHTML='<p class="inline-error">'+error+'</p>';return}
asyncAction(()=>{if(scenario==='network'){scenario='normal';$('#checkout-error').innerHTML='<div class="infobar error"><div><b>No se pudo confirmar la venta</b>La simulación interrumpió la solicitud antes de procesarla. Tu carrito se conserva. Podés volver a confirmar.</div></div>';$$('#modal button').forEach(b=>b.disabled=false);return}
let items=cart.map(l=>({name:l.p.name,size:l.x.size,color:l.x.color,sku:l.x.sku,qty:l.qty,unit:price(l.x),subtotal:lineTotal(l)}));
cart.forEach(l=>{l.x.stock[store()].Salón-=l.qty});let sale={id:'V-'+String(sales.length+1041).padStart(6,'0'),store:store(),total,method,customer:customer||'Consumidor final',items,date:new Date().toLocaleString('es-AR'),change:method==='cash'?received-total:0};sales.unshift(sale);pendingSale=sale;cart=[];closeModal();go('resultado')},'Confirmando venta simulada…')}
function result(){let s=pendingSale;if(!s)return emptySection('Todavía no hay una venta confirmada','Podés comenzar una venta desde el punto de venta.',"go('vender')",'Ir a Vender');return '<div style="max-width:760px;margin:auto"><div style="text-align:center"><div class="successmark">✓</div><h1>Venta registrada</h1><p>'+s.id+' · '+s.store+'</p>'+pill('Confirmación simulada','good')+'</div><div class="receipt"><h3>CASA OLIVA</h3><p style="text-align:center">Ticket comercial interno<br>'+s.id+' · '+s.date+'</p>'+s.items.map(x=>'<div style="border-top:1px dashed #c9cdbf;padding:13px 0"><b>'+esc(x.name)+'</b><br><small>'+esc(x.size+' / '+x.color)+' · '+x.sku+'</small><div class="total-line"><span>'+x.qty+' unidad(es)</span><b>'+money(x.subtotal)+'</b></div></div>').join('')+'<div class="total-line final"><span>Total</span><span>'+money(s.total)+'</span></div><p style="margin-top:14px">Cliente '+esc(s.customer)+'<br>Pago '+({cash:'Efectivo',mixed:'Efectivo + transferencia',fiado:'Fiado',transfer:'Transferencia',debit:'Débito',credit:'Crédito',qr:'QR'}[s.method])+'</p>'+(s.change?'<p>Vuelto '+money(s.change)+'</p>':'')+'<small>Documento de demostración, sin validez fiscal.</small></div><div class="actions" style="justify-content:center">'+btn('Nueva venta',"go('vender')",'primary')+btn('Ver historial',"go('historial')")+btn('Ver existencias',"go('inventario')")+'</div></div>'}
function salesHistory(){return head('Historial de ventas','Operaciones de esta sesión de demostración.', '<a class="btn primary" href="#vender">Nueva venta</a>')+'<section class="panel">'+(sales.length?sales.map(s=>'<div class="row" style="border:0;border-bottom:1px solid var(--line);border-radius:0;margin:0"><div><b>'+s.id+'</b><br><small>'+s.date+' · '+s.store+'</small></div><b>'+money(s.total)+'</b>'+btn('Ver ticket',"pendingSale=sales.find(s=>s.id==='"+s.id+"');go('resultado')")+'</div>').join(''):'<div class="empty"><h2>Todavía no registraste ventas</h2><p>Las operaciones simuladas aparecerán acá.</p><a class="btn primary" href="#vender">Ir a Vender</a></div>')+'</section>'}
function home(){return head('Buen día, María','Una mirada a tu comercio y un acceso directo a lo que sigue.', '<a class="btn primary" href="#vender">＋ Nueva venta</a>')+'<div class="cover"><div><span class="pill">Casa Oliva · '+store()+'</span><h2 style="margin-top:15px">Todo listo para empezar tu jornada.</h2><p>Tu catálogo y tu operación, conectados en un mismo lugar.</p><a class="btn" href="#productos">Revisar productos →</a></div><span class="bigmark" aria-hidden="true">✳</span></div><div class="stats"><div class="stat"><small>Ventas de la demo</small><strong>'+money(sales.reduce((a,s)=>a+s.total,0))+'</strong><small>'+sales.length+' operaciones</small></div><div class="stat"><small>Tu caja</small><strong style="font-size:22px">'+(cashOpen?'Abierta':'No disponible')+'</strong><a href="#gestion">Consultar sesión →</a></div><div class="stat"><small>Productos</small><strong>'+products.length+'</strong><small>En catálogo</small></div><div class="stat"><small>Para continuar</small><strong>'+products.filter(p=>prep(p)[1]!=='good').length+'</strong><a href="#productos">Revisar preparación →</a></div></div><div class="quicklinks"><a href="#gestion"><b>Caja y cierre diario ↗</b><small>Tu sesión, movimientos y arqueo</small></a><a href="#gestion"><b>Compras y proveedores ↗</b><small>Recepciones y reposición</small></a><a href="#gestion"><b>Informes del negocio ↗</b><small>Ventas, inventario y resultados</small></a></div>'}
function inventory(){let rows=allVars().filter(({p})=>p.active);return head('Existencias','Stock actual por variante · '+store(),'<a class="btn" href="#productos">Ver catálogo</a>')+'<div class="infobar"><div>La simulación muestra saldos de Salón y Depósito. La aplicación definitiva utiliza las métricas calculadas por el backend.</div></div><section class="panel">'+rows.map(({p,x})=>'<div class="summary-row"><b>'+esc(p.name)+'<br><small>'+esc(x.size+' · '+x.color)+' / '+esc(x.sku)+'</small></b><span>Físico<br><b>'+(p.unknown?'Desconocido':x.stock[store()].Salón??'Sin saldo')+'</b></span><span>Reservado<br><b>'+(p.unknown?'Desconocido':'0')+'</b></span><span>Vendible<br><b>'+(p.unknown?'Desconocido':stock(x)??'Sin saldo')+'</b><br>'+btn('Ver producto',"openProduct('"+p.id+"','detalle')",'linkbtn')+'</span></div>').join('')+'</section>'}
function clients(){return head('Clientes','Accesos de contexto para ventas y cuentas corrientes.')+'<section class="panel panel-pad"><h2>Directorio de ejemplo</h2><div class="row"><div><b>Ana García</b><br><small>Disponible en el cobro simulado</small></div><a class="btn" href="#vender">Iniciar venta</a></div><div class="row"><div><b>Lucía Pérez</b><br><small>Disponible en el cobro simulado</small></div><a class="btn" href="#vender">Iniciar venta</a></div><p class="footnote">La gestión completa de clientes se diseñará en su recorrido. Esta vista muestra su descubribilidad.</p></section>'}
function management(){return head('Gestión','Caja, compras e informes al alcance de tu jornada.')+'<div class="split"><section class="panel panel-pad"><h2>Tu caja · '+store()+'</h2><p>'+pill(cashOpen?'Sesión operativa de María':'Sesión no disponible',cashOpen?'good':'warn')+'</p><p>Estado local para revisar precondiciones del cobro.</p>'+btn(cashOpen?'Simular caja no disponible':'Simular sesión disponible','cashOpen=!cashOpen;render()')+'<hr style="border:0;border-top:1px solid var(--line);margin:25px 0"><h2>Compras, proveedores e informes</h2><p class="aside-note">Estos accesos se agrupan aquí y se destacan también en Inicio. Sus recorridos completos conservan el alcance definido en el plan.</p>'+btn('Ver alcance de esta propuesta','scopeModal()')+'</section><section class="panel prep"><h3>Accesos frecuentes</h3><div class="checkline"><a href="#historial">Historial de ventas →</a></div><div class="checkline"><a href="#inventario">Consultar existencias →</a></div><div class="checkline"><a href="#productos">Preparar productos →</a></div></section></div>'}
function scopeModal(){showModal('Alcance de la demostración','<p>El recorrido interactivo cubre Productos → Crear → Variantes → Precios → Mercadería → Resumen → Vender → Cobrar → Resultado.</p><p>Compras, proveedores e informes representan accesos de navegación. Sus pantallas operativas completas se implementarán después de aprobar su diseño y contratos.</p>',btn('Entendido','closeModal()'))}
$('#store').addEventListener('change',()=>{if(cart.length){$('#store').value=store.previous||'Palermo';showModal('Venta en preparación','<p>Terminá o vaciá la venta actual antes de cambiar la sucursal. Podés seguir trabajando en el carrito.</p>',btn('Continuar venta',"closeModal();go('vender')",'primary'));return}store.previous=store();savedPrice={};render();notify('Contexto actualizado a '+store()+'.')});store.previous='Palermo';
let acceptedRoute=activeRoute();
window.addEventListener('hashchange',()=>{let nextRoute=activeRoute();if((generalDirty||variantDraft)&&['crear','ficha'].includes(acceptedRoute)&&nextRoute!==acceptedRoute){let target=nextRoute;window.history.replaceState(null,'','#'+acceptedRoute);showModal('Hay cambios sin guardar','<p>Podés continuar editando o descartar voluntariamente los cambios locales. Los datos ya confirmados se conservan.</p>',btn('Continuar editando','closeModal()')+btn('Descartar y salir',"discardAndGo('"+esc(target)+"')",'danger'));return}acceptedRoute=nextRoute;render()});
function discardAndGo(route){generalDirty=false;variantDraft=false;formDraft={};preview=[];closeModal();go(route)}
window.addEventListener('beforeunload',e=>{if(generalDirty||variantDraft){e.preventDefault();e.returnValue=''}});
render();
</script>
</body></html>
