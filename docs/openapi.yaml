        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/catalog/pending-attributes:
    get:
      operationId: listPendingCatalogAttributes
      summary: Listar variantes con texto histórico sin asociación.
      description: Requiere catalog:manage. La resolución manual usa el PATCH versionado de variantes.
      parameters:
        - name: q
          in: query
          schema: {type: string, maxLength: 160}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, maximum: 100000, default: 0}
      responses:
        '200':
          description: Página de hasta 25 variantes ordenadas por SKU e identificador.
          content:
            application/json:
              schema:
                type: object
                required: [items, hasMore]
                properties:
                  hasMore: {type: boolean}
                  items:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Variant'
                        - type: object
                          required: [productName]
                          properties:
                            productName: {type: string}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/products:
    get:
      operationId: listProducts
      summary: Listar productos por comercio y filtrar por nombre, SKU, categoría o marca.
      description: El personal puede ver productos activos. El propietario también ve los inactivos.
      parameters:
        - name: store_id
          in: query
          description: Sucursal opcional para solicitar una vista resumida por producto.
          schema: {type: string, format: uuid}
        - name: q
          in: query
          schema: {type: string, maxLength: 160}
        - name: categoryId
          in: query
          schema: {type: string, format: uuid}
        - name: brandId
          in: query
          schema: {type: string, format: uuid}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, maximum: 100000, default: 0}
      responses:
        '200':
          description: Página ordenada por nombre e identificador.
          content:
            application/json:
              schema:
                type: object
                required: [items, hasMore, canManage]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Product'}
                  hasMore: {type: boolean}
                  canManage: {type: boolean}
                  previews:
                    type: array
                    description: Foto y resumen de precios y existencias de los productos de la página. El precio y el stock dependen de permisos y alcance de sucursal.
                    items:
                      type: object
                      required: [productId, photoId, currency, minPrice, maxPrice, pricePartial, stockReadable, available]
                      properties:
                        productId: {type: string, format: uuid}
                        photoId: {type: [string, 'null'], format: uuid}
                        currency: {type: [string, 'null']}
                        minPrice: {type: [string, 'null']}
                        maxPrice: {type: [string, 'null']}
                        pricePartial: {type: boolean}
                        stockReadable: {type: boolean}
                        available: {type: [integer, 'null'], format: int64}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
    post:
      operationId: createProduct
      summary: Crear un producto activo.
      description: Requiere catalog:manage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 160}
                description: {type: string, maxLength: 2000}
                categoryId: {$ref: '#/components/schemas/NullableClassificationID'}
                brandId: {$ref: '#/components/schemas/NullableClassificationID'}
      responses:
        '201': {$ref: '#/components/responses/Product'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/products/{id}:
    parameters:
      - $ref: '#/components/parameters/ProductID'
    get:
      operationId: getProduct
      summary: Obtener un producto y sus variantes.
      description: El personal ve variantes activas. El propietario también ve las inactivas.
      responses:
        '200':
          description: Detalle del producto.
          content:
            application/json:
              schema:
                type: object
                required: [product, variants, images]
                properties:
                  product: {$ref: '#/components/schemas/Product'}
                  variants:
                    type: array
                    items: {$ref: '#/components/schemas/Variant'}
                  images:
                    type: array
                    items: {$ref: '#/components/schemas/ProductPhoto'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateProduct
      summary: Editar nombre, descripción, estado o clasificación.
      description: Requiere catalog:manage. Omitir una clasificación conserva su valor y enviar null la quita.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 2
              required: [expectedRevision]
              properties:
                expectedRevision: {type: integer, format: int64, minimum: 1, description: Revisión leída del recurso.}
                name: {type: string, minLength: 1, maxLength: 160}
                description: {type: string, maxLength: 2000}
                categoryId: {$ref: '#/components/schemas/NullableClassificationID'}
                brandId: {$ref: '#/components/schemas/NullableClassificationID'}
                status: {type: string, enum: [active, inactive]}
      responses:
        '200': {$ref: '#/components/responses/Product'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/products/{id}/images:
    post:
      operationId: uploadProductPhoto
      summary: Agregar una foto JPEG o PNG a un producto.
      description: Requiere catalog:manage. Admite hasta 5 MiB, 4096 píxeles por lado, 12 megapíxeles y 6 fotos por producto.
      parameters:
        - $ref: '#/components/parameters/ProductID'
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: {type: string, format: binary}
          image/png:
            schema: {type: string, format: binary}
      responses:
        '201': {$ref: '#/components/responses/ProductPhotoList'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/products/{id}/images/{imageId}:
    parameters:
      - $ref: '#/components/parameters/ProductID'
      - $ref: '#/components/parameters/ProductImageID'
    get:
      operationId: getProductPhoto
      summary: Descargar la foto del producto.
      description: El personal ve fotos de productos activos. El propietario también ve fotos de productos inactivos.
      responses:
        '200':
          description: JPEG de la foto.
          content:
            image/jpeg:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteProductPhoto
      summary: Quitar una foto. Si era la principal, se elige otra si existe.
      description: Requiere catalog:manage.
      responses:
        '200': {$ref: '#/components/responses/ProductPhotoList'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/products/{id}/images/{imageId}/primary:
    put:
      operationId: setPrimaryProductPhoto
      summary: Elegir la foto principal del producto.
      description: Requiere catalog:manage.
      parameters:
        - $ref: '#/components/parameters/ProductID'
        - $ref: '#/components/parameters/ProductImageID'
      responses:
        '200': {$ref: '#/components/responses/ProductPhotoList'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/products/{id}/variants:
    parameters:
      - $ref: '#/components/parameters/ProductID'
    post:
      operationId: createVariant
      summary: Crear una variante en un producto activo.
      description: Requiere catalog:manage. El SKU es único por comercio sin distinguir mayúsculas. El primer código es el principal. Una referencia activa captura el nombre maestro. El texto enviado junto con la referencia, si no está vacío, se comprueba contra ese nombre. Generar un código interno lo agrega como secundario si ya hay códigos o como principal si es el primero. El retiro se audita al reemplazar un SKU o quitar un código. Reutilizar exige indicarlo expresamente, OWNER, motivo y confirmación, y que las variantes históricas carezcan de operaciones pendientes. Los códigos de barras solo se pueden restituir a la misma variante. Idempotency-Key permite recuperar el resultado original con 201 si coinciden actor, producto y cuerpo normalizado. Si se reutiliza la clave con otros datos devuelve 409.
      parameters:
        - name: Idempotency-Key
          in: header
          schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]{1,128}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sku]
              properties:
                sku: {type: string, minLength: 1, maxLength: 80, examples: [REM-M-NEGRO]}
                size: {type: string, maxLength: 60}
                color: {type: string, maxLength: 60}
                sizeId: {type: [string, 'null'], format: uuid}
                colorId: {type: [string, 'null'], format: uuid}
                generateInternal: {type: boolean, default: false}
                reuseRetired: {type: boolean, default: false}
                reason: {type: string, maxLength: 500}
                confirmSensitive: {type: boolean}
                barcodes:
                  type: array
                  maxItems: 20
                  uniqueItems: true
                  items: {$ref: '#/components/schemas/Barcode'}
      responses:
        '201':
          description: Variante creada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Variant'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/products/{id}/variants/preview:
    post:
      operationId: previewVariantBatch
      summary: Validar combinaciones y sugerir SKU sin reservarlos.
      description: Requiere catalog:manage y producto activo del comercio. Solo consulta. Un SKU vacío solicita sugerencia. Cada conflicto indica la fila.
      parameters:
        - $ref: '#/components/parameters/ProductID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VariantBatchInput'}
      responses:
        '200':
          description: Previsualización en el orden enviado, incluidas filas con conflictos.
          content:
            application/json:
              schema:
                type: object
                required: [rows]
                properties:
                  rows:
                    type: array
                    items:
                      type: object
                      required: [row, sku, size, color, issues]
                      properties:
                        row: {type: integer, minimum: 1, maximum: 50}
                        sku: {type: string}
                        size: {type: string}
                        color: {type: string}
                        issues:
                          type: array
                          items: {$ref: '#/components/schemas/VariantBatchIssue'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/quick-products:
    post:
      operationId: quickCreateProduct
      summary: Alta rápida de un producto con variantes, identificadores, precios y stock inicial en una sola transacción.
      description: >-
        Requiere catalog:manage y la sucursal asignada al usuario. Si alguna fila trae precio requiere también pricing:manage
        y una lista asignada a la sucursal (409 price_list_missing si falta). Si alguna fila trae cantidad mayor que cero requiere
        inventory:adjust y una ubicación activa de la sucursal. Sin atributos se crea un producto simple con una sola variante.
        Cada atributo tiene rol size (columna talle), color o option (atributo adicional guardado en options). Los talles y colores
        se vinculan al maestro existente o se agregan; un valor inactivo se rechaza sin reactivarlo. El SKU vacío se asigna con la
        numeración del comercio. El código interno usa Code 128 con 16 dígitos y no es un GTIN; un código existente se valida contra
        el comercio y su historial de retiros. El stock inicial se registra como movimiento adjustment con motivo
        «Stock inicial · alta de producto». Todo se confirma o se revierte junto. La misma clave con el mismo actor y cuerpo devuelve
        el 201 original sin volver a escribir; con otro cuerpo devuelve 409 idempotency_conflict.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]{1,128}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QuickProductInput'}
      responses:
        '201':
          description: Alta confirmada (o resultado original de un reintento).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuickProductResult'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409':
          description: >-
            quick_product_invalid con rows (fila 1-based, campo, código: batch_duplicate, barcode_taken con existing.product,
            sku_taken, identifier_retired, attribute_inactive, invalid_field), price_list_missing, idempotency_conflict o
            idempotency_in_progress. Nada queda registrado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VariantBatchError'}
  /api/v1/products/{id}/variants/batch:
    post:
      operationId: createVariantBatch
      summary: Crear de 1 a 50 variantes en una sola transacción.
      description: Requiere catalog:manage, producto activo y SKU por fila. El orden de las filas, sus referencias y sus revisiones forman parte del contenido normalizado. Espacios de borde del SKU y estado activo omitido se normalizan. La misma clave con el mismo actor, producto y contenido devuelve el 201 original, aun si luego cambió el catálogo. Cualquier conflicto de fila revierte el lote. El resultado confirmado se retiene sin purga automática.
      parameters:
        - $ref: '#/components/parameters/ProductID'
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]{1,128}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VariantBatchInput'}
      responses:
        '201':
          description: Lote confirmado con UUID y códigos definitivos, en el orden de solicitud.
          content:
            application/json:
              schema:
                type: object
                required: [id, variants]
                properties:
                  id: {type: string, format: uuid}
                  variants:
                    type: array
                    items: {$ref: '#/components/schemas/Variant'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409':
          description: Clave usada con otros datos o errores de filas, con código por campo.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VariantBatchError'}
        '500':
          description: Error de persistencia. Si el servidor identifica la fila fallida, devuelve la estructura de filas. Un resultado de transporte incierto se recupera reenviando clave y contenido idénticos.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VariantBatchError'}
  /api/v1/products/{id}/variants/{variantId}:
    parameters:
      - $ref: '#/components/parameters/ProductID'
      - $ref: '#/components/parameters/PricingVariantID'
    patch:
      operationId: updateVariant
      summary: Editar atributos, estado o códigos de una variante.
      description: Requiere catalog:manage. barcodes reemplaza todos los códigos y el primero queda como principal. Un arreglo vacío quita todos los códigos. Omitir el campo conserva los actuales. Cambiar SKU, talle, color o códigos requiere OWNER, motivo y confirmación. Una corrección puede aplicarse si las referencias operativas están cerradas. Una operación abierta o de cierre no verificable devuelve 409 sensitive_history. La corrección conserva las instantáneas existentes. Una referencia activa captura el nombre maestro. El texto enviado junto con la referencia, si no está vacío, se comprueba contra ese nombre. Omitir ambas entradas de un atributo lo conserva. ID nulo sin texto lo deja sin valor. Un cambio efectivo de etiqueta pasa por T03. Generar un código interno lo agrega como secundario si ya hay códigos o como principal si es el primero. El retiro se audita al reemplazar un SKU o quitar un código. Reutilizar exige indicarlo expresamente, OWNER, motivo y confirmación, y que las variantes históricas carezcan de operaciones pendientes. Los códigos de barras solo se pueden restituir a la misma variante.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 2
              required: [expectedRevision]
              properties:
                expectedRevision: {type: integer, format: int64, minimum: 1, description: Revisión leída del recurso.}
                sku: {type: string, minLength: 1, maxLength: 80}
                size: {type: string, maxLength: 60}
                color: {type: string, maxLength: 60}
                status: {type: string, enum: [active, inactive]}
                reason: {type: string, maxLength: 500}
                confirmSensitive: {type: boolean}
                sizeId: {type: [string, 'null'], format: uuid}
                colorId: {type: [string, 'null'], format: uuid}
                generateInternal: {type: boolean, default: false}
                reuseRetired: {type: boolean, default: false}
                barcodes:
                  type: array
                  maxItems: 20
                  uniqueItems: true
                  items: {$ref: '#/components/schemas/Barcode'}
      responses:
        '200':
          description: Variante actualizada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Variant'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/barcodes/{code}/lookup:
    get:
      operationId: lookupBarcode
      summary: Identificar una variante activa de un producto activo por código de barras.
      description: Coincidencia exacta en el comercio de la sesión. Conserva ceros iniciales.
      parameters:
        - name: code
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Barcode'}
      responses:
        '200':
          description: Producto y variante asociados al código.
          content:
            application/json:
              schema:
                type: object
                required: [product, variant]
                properties:
                  product: {$ref: '#/components/schemas/Product'}
                  variant: {$ref: '#/components/schemas/Variant'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/price-lists:
    get:
      operationId: listPriceLists
      summary: Consultar listas, moneda y asignaciones de sucursales activas.
      description: Requiere pricing:manage.
      responses:
        '200':
          description: Configuración de precios del comercio.
          content:
            application/json:
              schema:
                type: object
                required: [currency, lists, stores]
                properties:
                  currency: {type: string, examples: [ARS]}
                  lists:
                    type: array
                    items: {$ref: '#/components/schemas/PriceList'}
                  stores:
                    type: array
                    items:
                      type: object
                      required: [id, code, name, listId]
                      properties:
                        id: {type: string, format: uuid}
                        code: {type: string}
                        name: {type: string}
                        listId: {$ref: '#/components/schemas/NullablePriceListID'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
    post:
      operationId: createPriceList
      summary: Crear una lista vacía y reutilizable en el comercio.
      description: Requiere pricing:manage. El nombre es único por comercio sin distinguir mayúsculas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 120}
      responses:
        '201':
          description: Lista creada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PriceList'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/stores/{id}/price-list:
    put:
      operationId: assignStorePriceList
      summary: Reemplazar o quitar la lista asignada a una sucursal activa.
      description: Requiere pricing:manage. Una lista se puede asignar a varias sucursales. listId igual a null quita la asignación.
      parameters:
        - $ref: '#/components/parameters/PricingID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [listId]
              properties:
                listId: {$ref: '#/components/schemas/NullablePriceListID'}
      responses:
        '204':
          description: Asignación actualizada.
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/price-lists/{id}/items/{variantId}:
    parameters:
      - $ref: '#/components/parameters/PricingID'
      - $ref: '#/components/parameters/PricingVariantID'
    get:
      operationId: getConfiguredPrice
      summary: Leer el precio de una variante en una lista.
      description: Requiere pricing:manage. Un importe null indica que falta el precio.
      responses:
        '200': {$ref: '#/components/responses/PriceItem'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
    put:
      operationId: setConfiguredPrice
      summary: Guardar o quitar el precio de una variante en una lista.
      description: Requiere pricing:manage. El importe se envía como texto decimal con punto o como null para quitar el precio. Las repeticiones con el mismo valor conservan el estado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceItem'
      responses:
        '200': {$ref: '#/components/responses/PriceItem'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/stores/{id}/variants/{variantId}/price:
    get:
      operationId: resolveStorePrice
      summary: Resolver el precio de una variante para la sucursal indicada.
      description: Requiere una sucursal activa asignada al usuario y una variante activa de un producto activo. El único origen de precio es la lista asignada a esa sucursal.
      parameters:
        - $ref: '#/components/parameters/PricingID'
        - $ref: '#/components/parameters/PricingVariantID'
      responses:
        '200':
          description: Precio exacto o ausencia de precio.
          content:
            application/json:
              schema:
                type: object
                required: [amount, listId, currency, reason]
                properties:
                  amount: {$ref: '#/components/schemas/PriceAmount'}
                  listId: {$ref: '#/components/schemas/NullablePriceListID'}
                  currency: {type: string, examples: [ARS]}
                  reason: {type: string, enum: [configured, no_list, no_price]}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/locations:
    get:
      operationId: listStockLocations
      summary: Listar ubicaciones activas de una sucursal asignada.
      parameters:
        - $ref: '#/components/parameters/InventoryStoreQuery'
      responses:
        '200':
          description: Ubicaciones y permisos de inventario del usuario.
          content:
            application/json:
              schema:
                type: object
                required: [items, canManage, canAdjust, canManageMinimums, timezone]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/StockLocation'}
                  canManage: {type: boolean}
                  canAdjust: {type: boolean}
                  canManageMinimums: {type: boolean}
                  timezone: {type: string, examples: [America/Argentina/Tucuman]}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
    post:
      operationId: createStockLocation
      summary: Crear una ubicación en una sucursal asignada.
      description: Requiere locations:manage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [storeId, code, name, type]
              properties:
                storeId: {type: string, format: uuid}
                code: {type: string, minLength: 1, maxLength: 40}
                name: {type: string, minLength: 1, maxLength: 160}
                type: {type: string, enum: [sales_floor, warehouse]}
                isSellable: {type: boolean, default: false}
      responses:
        '201':
          description: Ubicación creada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StockLocation'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/inventory:
    get:
      operationId: listStockBalances
      summary: Consultar existencias por variante y ubicación.
      parameters:
        - $ref: '#/components/parameters/InventoryStoreQuery'
        - name: location_id
          in: query
          schema: {type: string, format: uuid}
        - name: low_stock
          in: query
          description: Con true devuelve solo variantes activas en o por debajo del mínimo.
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Stock físico, reservado, disponible y mínimos de las ubicaciones activas.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/StockBalance'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/inventory/existences:
    get:
      operationId: listBranchExistences
      summary: Consultar existencias paginadas en una sucursal asignada.
      description: >
        Requiere inventory:read. Página de hasta 25 filas de variantes o productos sin variantes.
        Incluye resumen del conjunto filtrado. Vendible solo cubre productos y variantes activos
        y ubicaciones activas vendibles. Null indica ausencia de saldo registrado. El stock bajo
        utiliza el mínimo de cada ubicación activa. La consulta no reserva disponibilidad.
      parameters:
        - $ref: '#/components/parameters/InventoryStoreQuery'
        - {name: q, in: query, schema: {type: string, maxLength: 160}}
        - {name: categoryId, in: query, schema: {type: string, format: uuid}}
        - {name: brandId, in: query, schema: {type: string, format: uuid}}
        - {name: producto, in: query, schema: {type: string, enum: [active, inactive]}}
        - {name: variante, in: query, schema: {type: string, enum: [active, inactive]}}
        - {name: saldo, in: query, schema: {type: string, enum: [positive, zero, unrecorded]}}
        - {name: ubicacion, in: query, schema: {type: string, format: uuid}}
        - {name: bajo, in: query, schema: {type: string, enum: ['0', '1']}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 4001, default: 1}}
      responses:
        '200':
          description: Página y resumen de las existencias.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExistencePage'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/inventory/existences/csv:
    get:
      operationId: exportBranchExistencesCSV
      summary: Descargar en CSV todas las existencias que coinciden con los filtros.
      description: >
        Requiere inventory:read. Mismos filtros que la consulta paginada; page se ignora. Una fila por variante con código de barras,
        cantidades, mínimo, precio y valor de venta. Las columnas costo_unitario y valor_costo solo aparecen para quien tiene
        purchases:read. Más de 20.000 variantes responde 409 inventory_export_too_large.
      parameters:
        - $ref: '#/components/parameters/InventoryStoreQuery'
        - {name: q, in: query, schema: {type: string, maxLength: 160}}
        - {name: categoryId, in: query, schema: {type: string, format: uuid}}
        - {name: brandId, in: query, schema: {type: string, format: uuid}}
        - {name: producto, in: query, schema: {type: string, enum: [active, inactive]}}
        - {name: variante, in: query, schema: {type: string, enum: [active, inactive]}}
        - {name: saldo, in: query, schema: {type: string, enum: [positive, zero, unrecorded]}}
        - {name: ubicacion, in: query, schema: {type: string, format: uuid}}
        - {name: bajo, in: query, schema: {type: string, enum: ['0', '1']}}
      responses:
        '200':
          description: Archivo inventario.csv en UTF-8 con BOM.
          content:
            text/csv:
              schema: {type: string}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/inventory/costs:
    put:
      operationId: setInventoryCosts
      summary: Cargar el costo unitario del stock actual de variantes.
      description: >
        Requiere purchases:manage. Fija el costo promedio de las unidades que cada variante tiene hoy en la sucursal, por ejemplo
        stock inicial sin costo. Las compras siguientes promedian desde ese valor. Cada cambio queda registrado con el costo
        anterior. Una variante sin unidades responde 409 inventory_cost_without_stock.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [storeId, items]
              properties:
                storeId: {type: string, format: uuid}
                reason: {type: string, maxLength: 300}
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    required: [variantId, unitCost]
                    properties:
                      variantId: {type: string, format: uuid}
                      unitCost: {$ref: '#/components/schemas/CashAmount'}
      responses:
        '200':
          description: Costos aplicados.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [variantId, previousUnitCost, unitCost, quantityOnHand]
                      properties:
                        variantId: {type: string, format: uuid}
                        previousUnitCost: {type: [string, 'null']}
                        unitCost: {$ref: '#/components/schemas/CashAmount'}
                        quantityOnHand: {type: integer, minimum: 1}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/inventory/existences/{variantId}:
    get:
      operationId: getBranchExistence
      summary: Consultar el desglose de una variante en una sucursal asignada.
      description: Requiere inventory:read. Incluye las ubicaciones activas y las inactivas que conservan un saldo o mínimo de la variante.
      parameters:
        - $ref: '#/components/parameters/InventoryStoreQuery'
        - {name: variantId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Existencias de la variante y su desglose.
          content:
            application/json:
              schema:
                type: object
                required: [item, locations, access]
                properties:
                  item: {$ref: '#/components/schemas/ExistenceRow'}
                  locations:
                    type: array
                    items: {$ref: '#/components/schemas/ExistenceLocation'}
                  access: {$ref: '#/components/schemas/ExistenceAccess'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/reports/inventory:
    get:
      operationId: getInventoryValuation
      summary: Consultar la valuación del stock físico de una sucursal.
      description: Requiere permiso de lectura de inventario en la sucursal asignada. Incluye las unidades reservadas de todas las ubicaciones activas.
      parameters:
        - $ref: '#/components/parameters/InventoryStoreQuery'
      responses:
        '200':
          description: Cobertura de costos y valor del stock.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/InventoryValuationAmounts'
                  - type: object
                    required: [currency, locations]
                    properties:
                      currency: {type: string, pattern: '^[A-Z]{3}$'}
                      locations:
                        type: array
                        description: Valuación de cada ubicación activa, incluidas las ubicaciones vacías.
                        items:
                          allOf:
                            - $ref: '#/components/schemas/InventoryValuationAmounts'
                            - type: object
                              required: [locationId, code, name]
                              properties:
                                locationId: {type: string, format: uuid}
                                code: {type: string}
                                name: {type: string}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/reports/inventory/csv:
    get:
      operationId: exportInventoryValuation
      summary: Descargar la valuación de la sucursal y sus ubicaciones activas.
      parameters:
        - $ref: '#/components/parameters/InventoryStoreQuery'
      responses:
        '200':
          description: Archivo CSV en UTF-8. Las valuaciones no disponibles quedan vacías.
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            text/csv:
              schema: {type: string}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/inventory/minimums:
    put:
      operationId: setStockMinimum
      summary: Configurar o quitar el mínimo de una variante por ubicación.
      description: Requiere inventory:manage_minimums en la sucursal asignada. expectedVersion protege la lectura previa y devuelve minimum_stale si cambió el valor. El valor null quita el mínimo y cero configura una alerta cuando el disponible llega a cero.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [storeId, locationId, variantId, minimum]
              properties:
                storeId: {type: string, format: uuid}
                locationId: {type: string, format: uuid}
                variantId: {type: string, format: uuid}
                minimum: {type: [integer, 'null'], minimum: 0, maximum: 2147483647}
                expectedVersion: {type: string, description: UUID devuelto en minimumVersion de Existencias o unrecorded si el mínimo no existe.}
      responses:
        '204':
          description: Mínimo actualizado.
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/inventory/movements:
    get:
      operationId: listStockMovements
      summary: Consultar hasta los últimos 50 movimientos de una ubicación.
      parameters:
        - $ref: '#/components/parameters/InventoryStoreQuery'
        - name: location_id
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Movimientos ordenados del más reciente al más antiguo.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/StockMovement'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/inventory/movements/history:
    get:
      operationId: listInventoryMovementHistory
      summary: Consultar el historial físico de una sucursal asignada.
      description: >
        Requiere inventory:read. Devuelve hasta 25 movimientos descendentes por fecha y UUID.
        Los cursores older y newer corresponden a UUID inmutables de la misma sucursal.
        Desde y hasta son días inclusivos en la zona del comercio. Los extremos de transferencias
        de sucursales no asignadas se omiten. El stock vendible se consulta por separado.
      parameters:
        - $ref: '#/components/parameters/InventoryStoreQuery'
        - {name: q, in: query, description: Nombre mostrado o SKU histórico., schema: {type: string, maxLength: 160}}
        - name: tipo
          in: query
          schema:
            type: string
            enum: [adjustment, count_adjustment, transfer_dispatch, transfer_receipt, purchase_receipt, sale, sale_return, sale_exchange]
        - {name: desde, in: query, schema: {type: string, format: date}}
        - {name: hasta, in: query, schema: {type: string, format: date}}
        - {name: ubicacion, in: query, description: Ubicación afectada de la sucursal, schema: {type: string, format: uuid}}
        - {name: variante, in: query, schema: {type: string, format: uuid}}
        - {name: responsable, in: query, description: Nombre actual o UUID del actor., schema: {type: string, maxLength: 160}}
        - {name: referencia, in: query, description: UUID de movimiento o documento., schema: {type: string, format: uuid}}
        - {name: siguiente, in: query, description: Cursor older para registros más antiguos., schema: {type: string, format: uuid}}
        - {name: anterior, in: query, description: Cursor newer para registros más recientes., schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Página y ubicaciones actuales e históricas de la sucursal.
          content:
            application/json:
              schema:
                type: object
                required: [items, locations, timezone]
                properties:
                  items:
                    type: array
                    maxItems: 25
                    items: {$ref: '#/components/schemas/MovementHistoryItem'}
                  locations:
                    type: array
                    items: {$ref: '#/components/schemas/MovementHistoryLocation'}
                  timezone: {type: string}
                  older: {type: string, format: uuid}
                  newer: {type: string, format: uuid}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/inventory/movements/history/{id}:
    get:
      operationId: getInventoryMovementHistory
      summary: Consultar un movimiento histórico en la sucursal asignada.
      parameters:
        - $ref: '#/components/parameters/InventoryStoreQuery'
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Movimiento y zona horaria para su presentación.
          content:
            application/json:
              schema:
                type: object
                required: [item, timezone]
                properties:
                  item: {$ref: '#/components/schemas/MovementHistoryItem'}
                  timezone: {type: string}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/inventory/adjustments:
    post:
      operationId: adjustStock
      summary: Confirmar un ingreso o egreso manual con motivo.
      description: Requiere inventory:adjust. Repetir la clave con la misma persona y contenido devuelve el movimiento original. ExpectedRevision compara y vincula la vista previa a la operación. Una revisión vencida devuelve adjustment_stale. Una variante inactiva devuelve adjustment_inactive en el flujo condicionado.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9_.-]{1,128}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [storeId, locationId, variantId, delta, reason]
              properties:
                storeId: {type: string, format: uuid}
                locationId: {type: string, format: uuid}
                variantId: {type: string, format: uuid}
                delta: {type: integer, format: int32, not: {const: 0}}
                reason: {type: string, minLength: 1, maxLength: 300}
                expectedRevision: {type: string, pattern: '^(unrecorded|0|[1-9][0-9]{0,18})$', description: Revisión del saldo de la ubicación o unrecorded para el primer registro.}
      responses:
        '201':
          description: Movimiento confirmado o resultado original de un reintento.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StockMovement'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/inventory/adjustments/result:
    get:
      operationId: getInventoryAdjustmentResult
      summary: Consultar un ajuste previo por su clave de idempotencia.
      description: >
        Solo la misma persona con inventory:adjust en la sucursal asignada puede recuperar el ajuste.
        404 significa que la transacción todavía no es observable o que el ajuste queda fuera del alcance.
        El reenvío explícito debe usar exactamente el cuerpo y la clave originales.
      parameters:
        - $ref: '#/components/parameters/InventoryStoreQuery'
        - name: key
          in: query
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9_.-]{1,128}$'}
      responses:
        '200':
          description: Ajuste confirmado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StockMovement'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}

  /api/v1/transfers:
    get:
      operationId: listStockTransfers
      summary: Consultar las últimas 50 transferencias de una sucursal asignada.
      parameters:
        - $ref: '#/components/parameters/InventoryStoreQuery'
      responses:
        '200':
          description: Transferencias y destinos disponibles para operadores autorizados.
          content:
            application/json:
              schema:
                type: object
                required: [items, destinations, canTransfer]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/TransferSummary'}
                  destinations:
                    type: array
                    items: {$ref: '#/components/schemas/TransferLocation'}
                  canTransfer: {type: boolean}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
    post:
      operationId: createStockTransfer
      summary: Crear una transferencia en borrador.
      description: Requiere inventory:transfer en la sucursal de origen. El destino debe estar activo y pertenecer al mismo comercio. El borrador conserva los saldos.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9_.-]{1,128}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [storeId, originLocationId, destinationLocationId, items]
              properties:
                storeId: {type: string, format: uuid}
                originLocationId: {type: string, format: uuid}
                destinationLocationId: {type: string, format: uuid}
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    required: [variantId, quantity]
                    properties:
                      variantId: {type: string, format: uuid}
                      quantity: {type: integer, format: int32, minimum: 1, maximum: 2147483647}
      responses:
        '201': {$ref: '#/components/responses/StockTransfer'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/transfers/{id}:
    get:
      operationId: getStockTransfer
      summary: Consultar una transferencia visible desde el origen o el destino asignado.
      parameters:
        - $ref: '#/components/parameters/TransferID'
        - $ref: '#/components/parameters/InventoryStoreQuery'
      responses:
        '200': {$ref: '#/components/responses/StockTransfer'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/transfers/{id}/dispatch:
    post:
      operationId: dispatchStockTransfer
      summary: Despachar el borrador y descontar unidades del origen.
      description: Requiere inventory:transfer en el origen. Un reintento conserva el despacho original.
      parameters:
        - $ref: '#/components/parameters/TransferID'
      requestBody:
        $ref: '#/components/requestBodies/StoreAction'
      responses:
        '200': {$ref: '#/components/responses/StockTransfer'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/transfers/{id}/cancel:
    post:
      operationId: cancelStockTransfer
      summary: Cancelar un borrador de transferencia.
      description: Requiere inventory:transfer en el origen. La cancelación conserva los saldos.
      parameters:
        - $ref: '#/components/parameters/TransferID'
      requestBody:
        $ref: '#/components/requestBodies/StoreAction'
      responses:
        '200': {$ref: '#/components/responses/StockTransfer'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/transfers/{id}/receive:
    post:
      operationId: receiveStockTransfer
      summary: Confirmar la recepción y acreditar las unidades recibidas.
      description: Requiere inventory:transfer en el destino. Enviá todas las variantes y un motivo si hay faltantes. Repetir la misma recepción conserva el resultado.
      parameters:
        - $ref: '#/components/parameters/TransferID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [storeId, items]
              properties:
                storeId: {type: string, format: uuid}
                reason: {type: string, maxLength: 300}
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    required: [variantId, quantity]
                    properties:
                      variantId: {type: string, format: uuid}
                      quantity: {type: integer, format: int32, minimum: 0, maximum: 2147483647}
      responses:
        '200': {$ref: '#/components/responses/StockTransfer'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/inventory/counts:
    get:
      operationId: listPhysicalStockCounts
      summary: Consultar hasta los últimos 50 conteos de una ubicación.
      parameters:
        - $ref: '#/components/parameters/InventoryStoreQuery'
        - name: location_id
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Conteos por fecha de apertura descendente.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/CountSummary'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
    post:
      operationId: startPhysicalStockCount
      summary: Abrir un conteo y registrar el saldo esperado por variante.
      description: Requiere inventory:adjust. Con draft true y sin variantIds abre una sesión vacía y guarda note. El contrato anterior usa de una a 100 variantes. La apertura conserva los saldos.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9_.-]{1,128}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [storeId, locationId]
              properties:
                storeId: {type: string, format: uuid}
                locationId: {type: string, format: uuid}
                draft: {type: boolean, default: false}
                note: {type: string, maxLength: 300}
                variantIds:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items: {type: string, format: uuid}
      responses:
        '201': {$ref: '#/components/responses/StockCount'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/inventory/counts/{id}:
    get:
      operationId: getPhysicalStockCount
      summary: Consultar cantidades esperadas y contadas.
      parameters:
        - $ref: '#/components/parameters/CountID'
        - $ref: '#/components/parameters/InventoryStoreQuery'
      responses:
        '200': {$ref: '#/components/responses/StockCount'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/inventory/counts/history:
    get:
      operationId: listPhysicalCountHistory
      summary: Listar conteos de la sucursal activa con progreso.
      description: Requiere inventory:read. Incluye ubicaciones inactivas para consultar su historial.
      parameters:
        - $ref: '#/components/parameters/InventoryStoreQuery'
        - {name: location_id, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {type: string, enum: [DRAFT, COMPLETED, CANCELLED]}}
        - {name: q, in: query, schema: {type: string, maxLength: 160}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 4001, default: 1}}
      responses:
        '200':
          description: Hasta 25 conteos y ubicaciones de la sucursal asignada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CountHistory'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/inventory/counts/{id}/draft:
    put:
      operationId: savePhysicalCountDraft
      summary: Guardar las cantidades observadas en el borrador.
      description: Requiere inventory:adjust. Reemplaza las líneas bajo expectedRevision. Un contado nulo representa una variante sin contar. Un arreglo vacío quita todas las líneas.
      parameters:
        - $ref: '#/components/parameters/CountID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CountDraftWrite'}
      responses:
        '200': {$ref: '#/components/responses/StockCount'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/CountConflict'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/inventory/counts/{id}/review:
    get:
      operationId: reviewPhysicalCount
      summary: Consultar saldos vigentes para revisar las diferencias guardadas.
      description: Requiere inventory:adjust. Incluye las líneas contadas y sus revisiones de stock. Cero explícito es una cantidad contada.
      parameters:
        - $ref: '#/components/parameters/CountID'
        - $ref: '#/components/parameters/InventoryStoreQuery'
      responses:
        '200':
          description: Revisión consistente de las líneas.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CountReview'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/CountConflict'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/inventory/counts/{id}/close:
    post:
      operationId: closeReviewedPhysicalCount
      summary: Confirmar un cierre de conteo con precondiciones de saldo y borrador.
      description: Requiere inventory:adjust. Aplica solo líneas contadas en una transacción. Repetir la misma clave y cuerpo como el mismo actor recupera el cierre original.
      parameters:
        - $ref: '#/components/parameters/CountID'
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, pattern: '^[A-Za-z0-9_.-]{1,128}$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CountCloseWrite'}
      responses:
        '200': {$ref: '#/components/responses/StockCount'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/CountConflict'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/inventory/counts/{id}/close-result:
    get:
      operationId: getReviewedPhysicalCountResult
      summary: Consultar el resultado del cierre por clave e identidad autorizada.
      description: Requiere inventory:adjust y el actor original. Un 404 indica un cierre todavía no observable o fuera de alcance.
      parameters:
        - $ref: '#/components/parameters/CountID'
        - $ref: '#/components/parameters/InventoryStoreQuery'
        - {name: key, in: query, required: true, schema: {type: string, pattern: '^[A-Za-z0-9_.-]{1,128}$'}}
      responses:
        '200': {$ref: '#/components/responses/StockCount'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/inventory/counts/{id}/complete:
    post:
      operationId: completePhysicalStockCount
      summary: Confirmar todas las cantidades de un conteo legado sin borrador guardado.
      description: Requiere inventory:adjust. Devuelve un conflicto si cambió el saldo desde la apertura o el resultado dejaría el físico debajo del reservado.
      parameters:
        - $ref: '#/components/parameters/CountID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [storeId, items]
              properties:
                storeId: {type: string, format: uuid}
                note: {type: string, maxLength: 300}
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    required: [variantId, quantity]
                    properties:
                      variantId: {type: string, format: uuid}
                      quantity: {type: integer, minimum: 0, maximum: 2147483647}
      responses:
        '200': {$ref: '#/components/responses/StockCount'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/inventory/counts/{id}/cancel:
    post:
      operationId: cancelPhysicalStockCount
      summary: Cancelar un conteo abierto.
      description: Requiere inventory:adjust. Cancelar conserva los saldos.
      parameters:
        - $ref: '#/components/parameters/CountID'
      requestBody:
        $ref: '#/components/requestBodies/StoreAction'
      responses:
        '200': {$ref: '#/components/responses/StockCount'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/cash-registers:
    get:
      operationId: listCashRegisters
      summary: Consultar las cajas y su ocupación en una sucursal asignada.
      parameters:
        - $ref: '#/components/parameters/InventoryStoreQuery'
      responses:
        '200':
          description: Cajas activas y moneda del comercio.
          content:
            application/json:
              schema:
                type: object
                required: [items, canManage, canDiscount, currency, timezone]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/CashRegister'}
                  canManage: {type: boolean}
                  canDiscount: {type: boolean}
                  currency: {type: string, examples: [ARS]}
                  timezone: {type: string}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
    post:
      operationId: createCashRegister
      summary: Dar de alta una caja de efectivo.
      description: Requiere cash:manage_registers en una sucursal asignada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [storeId, code, name]
              properties:
                storeId: {type: string, format: uuid}
                code: {type: string, minLength: 1, maxLength: 40}
                name: {type: string, minLength: 1, maxLength: 160}
      responses:
        '201':
          description: Caja creada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CashRegister'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/cash-sessions:
    get:
      operationId: listCashSessions
      summary: Consultar hasta las últimas 50 sesiones de una caja.
      description: El cajero ve sus sesiones. Los supervisores pueden consultar todas las sesiones de la sucursal asignada.
      parameters:
        - $ref: '#/components/parameters/InventoryStoreQuery'
        - name: register_id
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Sesiones accesibles ordenadas por apertura descendente.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/CashSession'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
    post:
      operationId: openCashSession
      summary: Abrir una caja con el efectivo inicial contado.
      description: Requiere cash:operate. Cada caja admite una sesión abierta. Reutilizar la clave con los mismos datos conserva la sesión original.
      parameters:
        - $ref: '#/components/parameters/CashIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [storeId, registerId, openingCash]
              properties:
                storeId: {type: string, format: uuid}
                registerId: {type: string, format: uuid}
                openingCash: {$ref: '#/components/schemas/CashAmount'}
      responses:
        '201': {$ref: '#/components/responses/CashSession'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/cash-sessions/{id}:
    get:
      operationId: getCashSession
      summary: Consultar la sesión y el efectivo esperado.
      parameters:
        - $ref: '#/components/parameters/CashSessionID'
        - $ref: '#/components/parameters/InventoryStoreQuery'
      responses:
        '200': {$ref: '#/components/responses/CashSession'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/cash-sessions/{id}/movements:
    parameters:
      - $ref: '#/components/parameters/CashSessionID'
    get:
      operationId: listCashMovements
      summary: Consultar hasta los últimos 100 movimientos de efectivo de una sesión.
      parameters:
        - $ref: '#/components/parameters/InventoryStoreQuery'
      responses:
        '200':
          description: Movimientos de efectivo ordenados del más reciente al más antiguo.
          content:
            application/json:
              schema:
                type: object
                required: [items, income, outflow, count]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/CashMovement'}
                  income: {type: string, description: Suma de ingresos en efectivo de toda la sesión.}
                  outflow: {type: string, description: Suma de egresos en efectivo de toda la sesión expresada como importe positivo.}
                  count: {type: integer, minimum: 0, description: Cantidad total de movimientos de la sesión.}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
    post:
      operationId: addCashMovement
      summary: Registrar un ingreso o egreso de efectivo en una sesión abierta.
      description: El importe debe ser positivo. El tipo determina el signo guardado y los egresos se limitan al efectivo esperado.
      parameters:
        - $ref: '#/components/parameters/CashIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [storeId, type, amount, reason]
              properties:
                storeId: {type: string, format: uuid}
                type: {type: string, enum: [manual_in, manual_out]}
                amount: {$ref: '#/components/schemas/CashAmount'}
                reason: {type: string, minLength: 1, maxLength: 300}
      responses:
        '201':
          description: Movimiento registrado o recuperado por un reintento.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CashMovement'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/cash-sessions/{id}/close:
    post:
      operationId: closeCashSession
      summary: Cerrar una sesión de caja con el efectivo contado.
      description: El arqueo guarda la diferencia entre efectivo declarado y esperado. Repetir el mismo cierre conserva el arqueo.
      parameters:
        - $ref: '#/components/parameters/CashSessionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [storeId, declaredCash]
              properties:
                storeId: {type: string, format: uuid}
                declaredCash: {$ref: '#/components/schemas/CashAmount'}
      responses:
        '200': {$ref: '#/components/responses/CashSession'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/suppliers:
    get:
      operationId: listSuppliers
      summary: Consultar proveedores del comercio.
      description: El propietario consulta activos e inactivos. El encargado con una sucursal activa asignada consulta proveedores activos.
      parameters:
        - name: q
          in: query
          description: Búsqueda por nombre, correo, teléfono, identificación fiscal o persona de contacto.
          schema: {type: string, maxLength: 160}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, maximum: 100000, default: 0}
      responses:
        '200':
          description: Página ordenada por nombre.
          content:
            application/json:
              schema:
                type: object
                required: [items, hasMore, canManage]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Supplier'}
                  hasMore: {type: boolean}
                  canManage: {type: boolean}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
    post:
      operationId: createSupplier
      summary: Dar de alta un proveedor activo en el comercio.
      description: Un nombre igual a otro proveedor del comercio (sin distinguir mayúsculas ni espacios) responde 409 supplier_duplicate con el proveedor existente, lo que también evita altas dobles. allowDuplicateName confirma un homónimo a propósito. La identificación fiscal no vacía no se repite nunca.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 160}
                email: {type: string, maxLength: 254}
                phone: {type: string, maxLength: 40}
                taxId: {type: string, maxLength: 20, description: CUIT u otra identificación fiscal. Se guarda sin espacios externos y en mayúsculas.}
                contactName: {type: string, maxLength: 120}
                allowDuplicateName: {type: boolean, default: false}
      responses:
        '201':
          description: Proveedor registrado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Supplier'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/SupplierDuplicate'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/suppliers/{id}:
    patch:
      operationId: updateSupplier
      summary: Actualizar los datos o el estado de un proveedor.
      description: Solo el propietario administra el padrón. Una cadena vacía borra el dato de contacto correspondiente.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: {type: string, minLength: 1, maxLength: 160}
                email: {type: string, maxLength: 254}
                phone: {type: string, maxLength: 40}
                status: {type: string, enum: [active, inactive]}
                taxId: {type: string, maxLength: 20}
                contactName: {type: string, maxLength: 120}
                allowDuplicateName: {type: boolean, default: false}
      responses:
        '200':
          description: Proveedor actualizado. Los pedidos ya registrados conservan el nombre con el que se emitieron.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Supplier'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/SupplierDuplicate'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/purchase-orders:
    get:
      operationId: listPurchaseOrders
      summary: Consultar órdenes de compra de una sucursal.
      description: Los propietarios y encargados pueden consultar las sucursales activas que tienen asignadas.
      parameters:
        - $ref: '#/components/parameters/InventoryStoreQuery'
        - name: supplier_id
          in: query
          description: UUID exacto del proveedor asociado a la orden, incluso si está inactivo. Un UUID sin coincidencias en la sucursal autorizada devuelve un resultado vacío.
          schema: {type: string, format: uuid}
        - name: status
          in: query
          description: Estado exacto o pending para incluir abiertas y parcialmente recibidas. Omitir para ver todas.
          schema: {type: string, enum: [pending, OPEN, PARTIALLY_RECEIVED, RECEIVED, CANCELLED, '']}
        - name: payment
          in: query
          description: due para pedidos con saldo a pagar o sin total calculable; paid para pedidos con total mayor que cero ya pagados. Omitir para ver todos.
          schema: {type: string, enum: [due, paid, '']}
        - name: q
          in: query
          description: Coincidencia parcial en el nombre histórico del proveedor, la referencia, el número (OC-0001), el SKU o el producto. Ignora mayúsculas y minúsculas.
          schema: {type: string, maxLength: 120}
        - name: from_date
          in: query
          description: Primer día de emisión, inclusive, en la zona horaria del comercio.
          schema: {type: string, format: date}
        - name: to_date
          in: query
          description: Último día de emisión, inclusive, en la zona horaria del comercio.
          schema: {type: string, format: date}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 50, default: 25}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, maximum: 100000, default: 0}
      responses:
        '200':
          description: Órdenes de la sucursal, de la más reciente a la más antigua, y totales de todas las órdenes que coinciden con los filtros.
          content:
            application/json:
              schema:
                type: object
                required: [items, hasMore, canManage, timezone, currency, summary]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/PurchaseOrder'}
                  hasMore: {type: boolean}
                  canManage: {type: boolean}
                  timezone: {type: string}
                  currency: {type: string, description: 'Moneda del comercio, para armar pedidos nuevos.'}
                  summary:
                    type: object
                    required: [orderCount, orderedUnits, receivedUnits, pendingUnits, pendingOrders, receivedOrders, payable, paid, balance,
                      ordersWithBalance, ordersWithoutTotal, checksToClear, checksToClearCount]
                    properties:
                      payable: {$ref: '#/components/schemas/CashAmount', description: Suma de los totales calculables.}
                      paid: {$ref: '#/components/schemas/CashAmount'}
                      balance: {$ref: '#/components/schemas/CashAmount', description: 'Lo que falta pagar de los pedidos con total; un saldo a favor no compensa otra deuda.'}
                      ordersWithBalance: {type: integer, format: int64, minimum: 0}
                      ordersWithoutTotal: {type: integer, format: int64, minimum: 0, description: Pedidos con algún renglón sin costo.}
                      checksToClear: {$ref: '#/components/schemas/CashAmount', description: Cheques vigentes cuya fecha de cobro es posterior a hoy.}
                      checksToClearCount: {type: integer, format: int64, minimum: 0}
                      orderCount: {type: integer, format: int64, minimum: 0}
                      orderedUnits: {type: integer, format: int64, minimum: 0}
                      receivedUnits: {type: integer, format: int64, minimum: 0}
                      pendingUnits: {type: integer, format: int64, minimum: 0, description: 'Lo pedido menos lo aceptado, sin contar pedidos cancelados.'}
                      pendingOrders: {type: integer, format: int64, minimum: 0, description: Pedidos abiertos o con recepción parcial.}
                      receivedOrders: {type: integer, format: int64, minimum: 0}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
    post:
      operationId: createPurchaseOrder
      summary: Registrar una orden de compra abierta.
      description: Requiere una sucursal activa asignada, un proveedor activo y variantes activas del comercio. La orden registra lo pedido. El ingreso de stock corresponde a una recepción posterior.
      parameters:
        - $ref: '#/components/parameters/CashIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [storeId, supplierId, items]
              properties:
                storeId: {type: string, format: uuid}
                supplierId: {type: string, format: uuid}
                reference: {type: string, maxLength: 60, description: 'Nota de pedido, factura o remito del proveedor. Opcional.'}
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    required: [variantId, quantity]
                    properties:
                      variantId: {type: string, format: uuid}
                      quantity: {type: integer, minimum: 1, maximum: 2147483647}
                      unitCost:
                        description: El costo omitido o nulo se guarda como desconocido.
                        oneOf:
                          - $ref: '#/components/schemas/CashAmount'
                          - type: 'null'
      responses:
        '201':
          description: Orden registrada o recuperada por su clave de idempotencia, con el estado y las cantidades recibidas vigentes.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PurchaseOrder'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/purchase-orders/csv:
    get:
      operationId: exportPurchaseOrders
      summary: Descargar todas las líneas de las órdenes de compra filtradas.
      description: Usa los permisos y filtros del listado. Los costos originales que no se informaron quedan vacíos.
      parameters:
        - $ref: '#/components/parameters/InventoryStoreQuery'
        - name: supplier_id
          in: query
          description: UUID exacto del proveedor asociado a la orden, incluso si está inactivo. Un UUID sin coincidencias en la sucursal autorizada devuelve un resultado vacío.
          schema: {type: string, format: uuid}
        - name: status
          in: query
          schema: {type: string, enum: [pending, OPEN, PARTIALLY_RECEIVED, RECEIVED, '']}
        - name: q
          in: query
          description: Coincidencia parcial por proveedor histórico, SKU o producto.
          schema: {type: string, maxLength: 120}
        - name: from_date
          in: query
          description: Primer día de emisión, inclusive, en la zona horaria del comercio.
          schema: {type: string, format: date}
        - name: to_date
          in: query
          description: Último día de emisión, inclusive, en la zona horaria del comercio.
          schema: {type: string, format: date}
      responses:
        '200':
          description: Archivo ordenes-de-compra.csv codificado en UTF-8.
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            text/csv:
              schema: {type: string}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/purchase-orders/{id}/receipts/csv:
    get:
      operationId: exportPurchaseReceipts
      summary: Descargar todas las líneas del historial de recepciones de una orden.
      description: Usa los permisos del historial e incluye costos unitarios registrados al recibir. Los costos faltantes quedan vacíos.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/InventoryStoreQuery'
      responses:
        '200':
          description: Archivo recepciones-de-compra.csv codificado en UTF-8. Incluye encabezado si la orden carece de recepciones.
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            text/csv:
              schema: {type: string}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/purchase-orders/{id}:
    get:
      operationId: getPurchaseOrder
      summary: Consultar un pedido de compra con sus cantidades recibidas vigentes.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/InventoryStoreQuery'
      responses:
        '200':
          description: Pedido.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PurchaseOrder'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/purchase-orders/{id}/cancel:
    post:
      operationId: cancelPurchaseOrder
      summary: Cancelar lo pendiente de un pedido.
      description: Solo pedidos abiertos o con recepción parcial. Lo ya recibido queda en el stock y en el historial; lo pendiente deja de esperarse y el pedido no admite más recepciones. Cancelar un pedido ya cancelado devuelve la cancelación original. Un pedido recibido completo responde 409 purchase_order_closed.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [storeId]
              properties:
                storeId: {type: string, format: uuid}
                reason: {type: string, maxLength: 300}
      responses:
        '200':
          description: Pedido cancelado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PurchaseOrder'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/purchase-orders/{id}/payments:
    post:
      operationId: registerSupplierPayment
      summary: Registrar un pago al proveedor de un pedido.
      description: >
        Requiere purchases:manage. Admite pagos parciales en efectivo, transferencia, cheque (con fecha de cobro opcional), tarjeta u
        otro medio. La fecha de pago no puede ser futura en la zona horaria del comercio. Si el pedido tiene total, el pago no puede
        superar el saldo (409 purchase_payment_exceeds). No mueve stock ni la caja. Idempotency-Key recupera el pago original.
      parameters:
        - $ref: '#/components/parameters/CashIdempotencyKey'
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [storeId, method, amount, paidOn]
              properties:
                storeId: {type: string, format: uuid}
                method: {type: string, enum: [cash, transfer, check, card, other]}
                amount: {$ref: '#/components/schemas/CashAmount'}
                paidOn: {type: string, format: date}
                checkDueOn: {type: string, format: date, description: Solo para cheques.}
                reference: {type: string, maxLength: 80, description: 'Comprobante, número de operación o de cheque.'}
                note: {type: string, maxLength: 300}
      responses:
        '201':
          description: Pedido con el pago registrado o recuperado por su clave de idempotencia.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PurchaseOrder'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/purchase-orders/{id}/payments/{paymentId}/void:
    post:
      operationId: voidSupplierPayment
      summary: Anular un pago al proveedor cargado por error.
      description: Requiere purchases:manage y un motivo. El pago queda en el historial y deja de sumar. Anular dos veces devuelve el pedido sin cambios.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: paymentId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [storeId, reason]
              properties:
                storeId: {type: string, format: uuid}
                reason: {type: string, minLength: 1, maxLength: 300}
      responses:
        '200':
          description: Pedido con el pago anulado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PurchaseOrder'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/purchase-orders/{id}/receipts:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: listPurchaseReceipts
      summary: Consultar el historial de recepciones de una orden de compra.
      parameters:
        - $ref: '#/components/parameters/InventoryStoreQuery'
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 50, default: 25}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, maximum: 100000, default: 0}
      responses:
        '200':
          description: Recepciones de la orden y resumen del historial completo.
          content:
            application/json:
              schema:
                type: object
                required: [items, hasMore, summary]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/PurchaseReceipt'}
                  hasMore: {type: boolean}
                  summary:
                    type: object
                    required: [receiptCount, acceptedWithCost, acceptedWithoutCost, rejectedUnits, knownValue, totalValue]
                    properties:
                      receiptCount: {type: integer, format: int64, minimum: 0}
                      acceptedWithCost: {type: integer, format: int64, minimum: 0}
                      acceptedWithoutCost: {type: integer, format: int64, minimum: 0}
                      rejectedUnits: {type: integer, format: int64, minimum: 0}
                      knownValue: {type: [string, 'null'], pattern: '^\d+\.\d{2}$', description: Valor de las unidades aceptadas con costo informado.}
                      totalValue: {type: [string, 'null'], pattern: '^\d+\.\d{2}$', description: Null si alguna unidad aceptada carece de costo.}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
    post:
      operationId: receivePurchaseOrder
      summary: Registrar la recepción parcial o completa de una orden.
      description: Se elige una ubicación activa de la sucursal de la orden. Solo las unidades aceptadas ingresan al stock (un movimiento purchase_receipt por variante) y reducen el saldo pendiente; no pueden superarlo. Las unidades no aceptadas (dañadas, producto equivocado, excedente u otro motivo) se registran con su motivo, no ingresan al stock y no consumen lo pendiente, por lo que un excedente se registra como no aceptado. Las unidades aceptadas admiten un costo unitario opcional en la moneda de la orden. Si se omite, el costo queda desconocido. Un pedido recibido o cancelado responde 409 purchase_order_closed.
      parameters:
        - $ref: '#/components/parameters/CashIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [storeId, locationId, items]
              properties:
                storeId: {type: string, format: uuid}
                locationId: {type: string, format: uuid}
                note: {type: string, maxLength: 300}
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    required: [orderItemId]
                    properties:
                      orderItemId: {type: string, format: uuid}
                      accepted: {type: integer, minimum: 0, maximum: 2147483647, default: 0}
                      rejected: {type: integer, minimum: 0, maximum: 100000, default: 0}
                      rejectionReason:
                        type: string
                        enum: [damaged, wrong_item, excess, other]
                        description: Obligatorio si rejected es mayor que cero; prohibido si es cero.
                      unitCost:
                        description: Costo efectivo de las unidades aceptadas. Omitir o enviar nulo si se desconoce.
                        oneOf:
                          - $ref: '#/components/schemas/CashAmount'
                          - type: 'null'
                    if:
                      required: [unitCost]
                      properties:
                        unitCost: {type: string}
                    then:
                      required: [accepted]
                      properties:
                        accepted: {minimum: 1}
                    anyOf:
                      - required: [accepted]
                        properties:
                          accepted: {minimum: 1}
                      - required: [rejected]
                        properties:
                          rejected: {minimum: 1}
      responses:
        '201':
          description: Recepción registrada o recuperada por su clave de idempotencia.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PurchaseReceipt'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/customers:
    get:
      operationId: listCustomers
      summary: Buscar clientes de una sucursal habilitada para operar caja.
      parameters:
        - $ref: '#/components/parameters/InventoryStoreQuery'
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, maximum: 100000, default: 0}
        - name: summary
          in: query
          description: Incluye saldos pendientes y última compra identificada de los clientes de la página según el alcance de ventas del usuario.
          schema: {type: boolean, default: false}
        - name: q
          in: query
          description: Parte del nombre o teléfono.
          schema: {type: string, maxLength: 120}
      responses:
        '200':
          description: Página de resultados.
          content:
            application/json:
              schema:
                type: object
                required: [items, hasMore]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Customer'}
                  hasMore: {type: boolean}
                  timezone: {type: string}
                  summaries:
                    type: array
                    items:
                      type: object
                      required: [customerId, lastPurchase, balances]
                      properties:
                        customerId: {type: string, format: uuid}
                        lastPurchase: {type: [string, 'null'], format: date-time}
                        balances:
                          type: array
                          items:
                            type: object
                            required: [currency, amount]
                            properties:
                              currency: {type: string}
                              amount: {type: string}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
    post:
      operationId: createCustomer
      summary: Registrar un cliente en una sucursal habilitada para operar caja.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [storeId, name]
              properties:
                storeId: {type: string, format: uuid}
                name: {type: string, minLength: 1, maxLength: 120}
                phone: {type: string, maxLength: 40}
      responses:
        '201':
          description: Cliente registrado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Customer'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/customers/{id}:
    patch:
      operationId: updateCustomer
      summary: Actualizar nombre y teléfono de un cliente de la sucursal.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [storeId, name, phone]
              properties:
                storeId: {type: string, format: uuid}
                name: {type: string, minLength: 1, maxLength: 120}
                phone: {type: string, maxLength: 40}
      responses:
        '200':
          description: Cliente actualizado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Customer'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/receivables:
    get:
      operationId: listReceivables
      summary: Consultar fiados pendientes o saldados de una sucursal.
      description: Los supervisores ven la sucursal asignada. Los cajeros ven las ventas originadas en sus sesiones.
      parameters:
        - $ref: '#/components/parameters/InventoryStoreQuery'
        - name: status
          in: query
          schema: {type: string, enum: [pending, partial, settled], default: pending}
          description: partial lista los fiados con saldo que ya recibieron abonos o compensaciones.
        - name: q
          in: query
          description: Nombre actual o histórico del cliente, con coincidencia parcial, o número exacto de venta. La búsqueda se aplica al listado y al resumen.
          schema: {type: string, maxLength: 120}
        - name: customer_id
          in: query
          description: Cliente exacto. Se combina con la búsqueda y se aplica al listado y al resumen.
          schema: {type: string, format: uuid}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, maximum: 100000, default: 0}
      responses:
        '200':
          description: Página de resultados y resumen de todos los fiados visibles, por moneda.
          content:
            application/json:
              schema:
                type: object
                required: [items, hasMore, summary, recentPayments]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Receivable'}
                  hasMore: {type: boolean}
                  summary:
                    type: array
                    items: {$ref: '#/components/schemas/ReceivableSummary'}
                  recentPayments:
                    type: array
                    maxItems: 10
                    description: Abonos más recientes de las cuentas visibles que coinciden con la búsqueda y el cliente. El estado del listado no los limita.
                    items: {$ref: '#/components/schemas/RecentReceivablePayment'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/reports/receivables/csv:
    get:
      operationId: exportReceivables
      summary: Descargar los fiados visibles de una sucursal.
      description: Exporta todas las cuentas que coinciden con la búsqueda y el estado. Las fechas de venta se expresan en UTC.
      parameters:
        - $ref: '#/components/parameters/InventoryStoreQuery'
        - name: status
          in: query
          schema: {type: string, enum: [pending, partial, settled], default: pending}
          description: partial lista los fiados con saldo que ya recibieron abonos o compensaciones.
        - name: q
          in: query
          description: Nombre actual o histórico del cliente o número exacto de venta.
          schema: {type: string, maxLength: 120}
        - name: customer_id
          in: query
          description: Cliente exacto. Se combina con la búsqueda y el estado.
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Archivo CSV en UTF-8 con encabezado incluso si no hay cuentas.
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            text/csv:
              schema: {type: string}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/receivables/{id}/payments:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: listReceivablePayments
      summary: Consultar los abonos, las compensaciones y el saldo vigente de un fiado.
      parameters:
        - $ref: '#/components/parameters/InventoryStoreQuery'
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, maximum: 100000, default: 0}
      responses:
        '200':
          description: Página de abonos y compensaciones con el saldo actual. La paginación se aplica a cada lista.
          content:
            application/json:
              schema:
                type: object
                required: [items, debtCredits, hasMore, outstandingAmount]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ReceivablePayment'}
                  debtCredits:
                    type: array
                    items: {$ref: '#/components/schemas/ReturnDebtCredit'}
                  hasMore: {type: boolean}
                  outstandingAmount: {$ref: '#/components/schemas/CashAmount'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
    post:
      operationId: addReceivablePayment
      summary: Aplicar un abono parcial o total en una caja abierta de la sucursal de la venta.
      description: El importe debe ser positivo y no superar el saldo. Solo el efectivo aumenta el saldo físico de caja. Repetir una clave con los mismos datos devuelve el abono original.
      parameters:
        - $ref: '#/components/parameters/CashIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [storeId, cashSessionId, method, amount]
              properties:
                storeId: {type: string, format: uuid}
                cashSessionId: {type: string, format: uuid}
                method: {$ref: '#/components/schemas/SalePaymentMethod'}
                amount: {$ref: '#/components/schemas/CashAmount'}
      responses:
        '201':
          description: Abono registrado o recuperado por su clave de idempotencia.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReceivablePayment'}
        '409': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/reservations:
    get:
      operationId: listReservations
      summary: Consultar las reservas por estado de una sucursal.
      parameters:
        - $ref: '#/components/parameters/InventoryStoreQuery'
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/ReservationStatus'}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, maximum: 100000, default: 0}
      responses:
        '200':
          description: Página de reservas. El estado predeterminado es ACTIVE.
          content:
            application/json:
              schema:
                type: object
                required: [items, hasMore]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Reservation'}
                  hasMore: {type: boolean}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
    post:
      operationId: createReservation
      summary: Reservar mercadería sin cobrar.
      parameters:
        - $ref: '#/components/parameters/CashIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [storeId, locationId, customerId, items]
              properties:
                storeId: {type: string, format: uuid}
                locationId: {type: string, format: uuid}
                customerId: {type: string, format: uuid}
                expiresAt: {type: [string, 'null'], format: date-time}
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: {$ref: '#/components/schemas/ReservationQuantity'}
      responses:
        '201':
          description: Reserva registrada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Reservation'}
        '409': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/reservations/{id}/deposit:
    post:
      operationId: addReservationDeposit
      summary: Registrar la seña de una reserva activa en una caja abierta.
      description: Admite una seña por reserva. El efectivo aumenta el arqueo de la sesión y queda registrado como anticipo. Una clave repetida con los mismos datos devuelve la seña original.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/CashIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [storeId, cashSessionId, method, amount]
              properties:
                storeId: {type: string, format: uuid}
                cashSessionId: {type: string, format: uuid}
                method: {$ref: '#/components/schemas/SalePaymentMethod'}
                amount: {$ref: '#/components/schemas/CashAmount'}
      responses:
        '201':
          description: Seña registrada o recuperada por su clave de idempotencia.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReservationDeposit'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/reservations/{id}/cancel:
    post:
      operationId: cancelReservation
      summary: Cancelar una reserva activa y liberar su stock.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [storeId]
              properties:
                storeId: {type: string, format: uuid}
      responses:
        '200':
          description: Reserva cancelada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Reservation'}
        '409': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/reservations/{id}/expire:
    post:
      operationId: expireReservation
      summary: Registrar el vencimiento de una reserva activa y liberar su stock.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [storeId]
              properties:
                storeId: {type: string, format: uuid}
      responses:
        '200':
          description: Reserva vencida.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Reservation'}
        '409': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/sales:
    get:
      operationId: listSales
      summary: Consultar ventas confirmadas de una sucursal.
      description: El cajero ve las ventas de sus sesiones. Los supervisores ven las ventas de la sucursal asignada. El resultado se ordena por número descendente.
      parameters:
        - $ref: '#/components/parameters/InventoryStoreQuery'
        - name: number
          in: query
          description: Número exacto de venta, con ceros iniciales opcionales.
          schema: {type: string, pattern: '^[0-9]+$'}
        - name: q
          in: query
          description: Coincidencia parcial con el cliente (ventas fiadas o de reservas) o el producto, o igualdad exacta con un SKU o un código de barras vendido.
          schema: {type: string, maxLength: 120}
        - name: from_date
          in: query
          description: Primer día, inclusive, en la zona horaria del comercio.
          schema: {type: string, format: date}
        - name: to_date
          in: query
          schema: {type: string, format: date}
        - $ref: '#/components/parameters/SaleMethodQuery'
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, maximum: 100000, default: 0}
      responses:
        '200':
          description: Página del historial de ventas accesibles.
          content:
            application/json:
              schema:
                type: object
                required: [items, hasMore]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/SaleSummary'}
                  hasMore: {type: boolean}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
    post:
      operationId: confirmSale
      summary: Confirmar una venta en una caja abierta.
      description: Requiere una sesión autorizada y una ubicación vendible de la sucursal. La API calcula el total con los precios vigentes. expectedUnitPrice permite detectar cambios. La confirmación registra los pagos, el stock y el efectivo neto en una transacción. Cada medio puede aparecer una vez. Una venta pagada cubre el total y una venta fiada requiere un cliente de la sucursal y deja saldo pendiente después del anticipo opcional. reservationId permite cobrar la mercadería apartada y completar la reserva en la misma transacción. expectedDeposit debe coincidir con la seña registrada. Si cubre toda la venta, se acepta una lista de pagos vacía.
      parameters:
        - $ref: '#/components/parameters/CashIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [storeId, cashSessionId, locationId, items]
              if:
                required: [onCredit]
                properties:
                  onCredit: {const: true}
              then:
                required: [customerId]
                not:
                  required: [cashReceived]
              else:
                not:
                  required: [customerId]
                if:
                  required: [reservationId]
                then:
                  not:
                    required: [cashReceived, payments]
                else:
                  oneOf:
                    - required: [cashReceived]
                    - required: [payments]
                  properties:
                    payments: {minItems: 1}
              dependentRequired:
                expectedDeposit: [reservationId]
              properties:
                onCredit: {type: boolean, default: false}
                customerId: {type: string, format: uuid}
                reservationId: {type: string, format: uuid}
                expectedDeposit: {$ref: '#/components/schemas/CashAmount'}
                storeId: {type: string, format: uuid}
                cashSessionId: {type: string, format: uuid}
                locationId: {type: string, format: uuid}
                cashReceived:
                  $ref: '#/components/schemas/CashAmount'
                  description: Forma compatible para pagar en efectivo. El vuelto se calcula contra el saldo tras aplicar la seña, si existe.
                payments:
                  type: array
                  maxItems: 5
                  description: Importes positivos. El importe en efectivo es el neto aplicado y el efectivo recibido puede ser mayor.
                  items:
                    type: object
                    additionalProperties: false
                    required: [method, amount]
                    properties:
                      method: {$ref: '#/components/schemas/SalePaymentMethod'}
                      amount: {$ref: '#/components/schemas/CashAmount'}
                      cashReceived: {$ref: '#/components/schemas/CashAmount'}
                    if:
                      properties:
                        method: {const: cash}
                    then:
                      required: [cashReceived]
                    else:
                      not:
                        required: [cashReceived]
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    required: [variantId, quantity, expectedUnitPrice]
                    properties:
                      variantId: {type: string, format: uuid}
                      quantity: {type: integer, minimum: 1, maximum: 2147483647}
                      expectedUnitPrice: {$ref: '#/components/schemas/CashAmount'}
                      discountPercent:
                        type: integer
                        minimum: 0
                        maximum: 80
                        description: Descuento por unidad para propietario o encargado de la sucursal. El descuento en centavos se redondea hacia abajo.
      responses:
        '201': {$ref: '#/components/responses/Sale'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/reports/collections:
    get:
      operationId: getCollectionsReport
      summary: Consultar el dinero cobrado y reintegrado por medio de pago.
      description: Cada pago cuenta el día local en que se recibió y con su medio real. Incluye pagos de ventas, señas de reservas, abonos de fiados, cobros de diferencias de cambios y reintegros (con importe negativo). Una venta fiada no suma hasta que se abona. Cajeros ven los movimientos de sus sesiones y supervisores los de la sucursal.
      parameters:
        - $ref: '#/components/parameters/InventoryStoreQuery'
        - name: from_date
          in: query
          schema: {type: string, format: date}
        - name: to_date
          in: query
          schema: {type: string, format: date}
        - name: method
          in: query
          schema: {type: string, enum: [cash, debit, credit, transfer, qr]}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, maximum: 100000, default: 0}
      responses:
        '200':
          description: Totales por medio, por origen y por día, con los movimientos paginados.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CollectionsReport'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/reports/purchases:
    get:
      operationId: getPurchasesReport
      summary: Consultar la mercadería recibida en un período.
      description: Agrupa las recepciones por día local, proveedor y producto, valuadas al costo cargado en cada recepción. Las unidades sin costo no suman importe. Requiere permiso de lectura de compras.
      parameters:
        - $ref: '#/components/parameters/InventoryStoreQuery'
        - name: from_date
          in: query
          schema: {type: string, format: date}
        - name: to_date
          in: query
          schema: {type: string, format: date}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, maximum: 100000, default: 0}
      responses:
        '200':
          description: Resumen, series y recepciones paginadas.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PurchasesReport'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/reports/sales:
    get:
      operationId: getSalesMarginReport
      summary: Consultar margen bruto por variante vendida.
      description: El reporte usa el precio y el snapshot de costo de cada línea al confirmar la venta. Cajeros ven sus propias sesiones y supervisores las ventas de la sucursal. Las devoluciones y comisiones no se descuentan. El parámetro to es exclusivo.
      parameters:
        - $ref: '#/components/parameters/InventoryStoreQuery'
        - name: from
          in: query
          description: Instante RFC 3339 inclusive.
          schema: {type: string, format: date-time}
        - name: to
          in: query
          description: Instante RFC 3339 exclusivo.
          schema: {type: string, format: date-time}
        - name: from_date
          in: query
          description: Primer día inclusive en la zona horaria del comercio. Usar con to_date o por sí solo. Incompatible con from y to.
          schema: {type: string, format: date}
        - name: to_date
          in: query
          description: Último día inclusive en la zona horaria del comercio. Usar con from_date o por sí solo. Incompatible con from y to.
          schema: {type: string, format: date}
        - name: q
          in: query
          description: Texto literal incluido en el SKU o en el nombre del producto guardados al vender. Ignora mayúsculas y minúsculas.
          schema: {type: string, maxLength: 120}
        - $ref: '#/components/parameters/SaleMethodQuery'
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, maximum: 100000, default: 0}
      responses:
        '200':
          description: Líneas paginadas con ventas, costo y margen bruto históricos.
          content:
            application/json:
              schema:
                type: object
                required: [items, hasMore, timezone, summary, topVariants, paymentTotals, dailyTotals, categoryTotals]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/SalesMarginLine'}
                  hasMore: {type: boolean}
                  timezone: {type: string}
                  summary:
                    type: array
                    description: Totales de todo el período, agrupados por moneda. Vacío si no hay ventas.
                    items: {$ref: '#/components/schemas/SalesMarginSummary'}
                  topVariants:
                    type: array
                    maxItems: 10
                    description: Variantes con más unidades vendidas en todo el período filtrado. Usa los datos actuales del catálogo para identificar cada variante. Los empates se ordenan por ID de variante.
                    items: {$ref: '#/components/schemas/TopSoldVariant'}
                  paymentTotals:
                    type: array
                    description: Importes por moneda y medio de las ventas que coinciden con el filtro. Cada importe corresponde al pago original, la seña aplicada o el saldo fiado inicial de la venta completa.
                    items: {$ref: '#/components/schemas/SalesPaymentTotal'}
                  dailyTotals:
                    type: array
                    description: Hasta los 31 días más recientes con ventas que coincidan con los filtros. Los totales se agrupan por día local y moneda.
                    items: {$ref: '#/components/schemas/SalesDailyTotal'}
                  categoryTotals:
                    type: array
                    description: Ventas originales por día local, moneda y categoría actual del catálogo. Hasta 31 días con ventas. La categoría es nula para artículos sin clasificación.
                    items:
                      type: object
                      required: [date, currency, categoryId, categoryName, netSales]
                      properties:
                        date: {type: string, format: date}
                        currency: {type: string}
                        categoryId: {type: [string, 'null'], format: uuid}
                        categoryName: {type: [string, 'null']}
                        netSales: {type: string}
                  activity:
                    type: array
                    description: Ventas del período netas de las devoluciones y de los reemplazos entregados en cambios, cada operación por su propia fecha. Lo devuelto se valúa al precio cobrado. Respeta la búsqueda por SKU o producto y el alcance del usuario.
                    items: {$ref: '#/components/schemas/SalesActivity'}
                  topProducts:
                    type: array
                    description: Hasta 10 productos por unidades que se llevaron los clientes (vendidas y entregadas en cambios, menos devueltas). Usa el nombre actual del catálogo.
                    items: {$ref: '#/components/schemas/TopSoldProduct'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/reports/sales/csv:
    get:
      operationId: exportSalesMarginReport
      summary: Descargar el reporte de margen bruto en CSV.
      description: Exporta todas las líneas del período con el mismo alcance de acceso que el reporte. Las fechas incluyen el desplazamiento de la zona horaria del comercio. Los valores desconocidos quedan vacíos.
      parameters:
        - $ref: '#/components/parameters/InventoryStoreQuery'
        - name: from
          in: query
          description: Instante RFC 3339 inclusive.
          schema: {type: string, format: date-time}
        - name: to
          in: query
          description: Instante RFC 3339 exclusivo.
          schema: {type: string, format: date-time}
        - name: from_date
          in: query
          description: Día inicial inclusive en la zona horaria del comercio. Incompatible con from y to.
          schema: {type: string, format: date}
        - name: to_date
          in: query
          description: Día final inclusive en la zona horaria del comercio. Incompatible con from y to.
          schema: {type: string, format: date}
        - name: q
          in: query
          description: Texto literal incluido en el SKU o en el nombre del producto guardados al vender. Ignora mayúsculas y minúsculas.
          schema: {type: string, maxLength: 120}
        - $ref: '#/components/parameters/SaleMethodQuery'
      responses:
        '200':
          description: Archivo margen-ventas.csv codificado en UTF-8, con encabezado incluso para un período vacío.
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            text/csv:
              schema: {type: string}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/sales/{id}:
    get:
      operationId: getSale
      summary: Consultar una venta confirmada y sus datos históricos.
      description: El cajero puede consultar ventas de sus sesiones. Los supervisores pueden consultar ventas de las sucursales asignadas.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/InventoryStoreQuery'
      responses:
        '200': {$ref: '#/components/responses/Sale'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/sales/{id}/return-operations:
    post:
      operationId: addReturnOperation
      summary: Registrar un cambio o devolución completo en una sola transacción.
      description: Registra lo que vuelve (con sus movimientos de stock), el reemplazo (salida de stock al precio vigente), el cobro de la diferencia, el descuento del fiado y el reintegro con los medios del pago original. Si algo falla no queda nada registrado. Lo devuelto se valúa al precio efectivamente pagado en la venta. Un reintento con la misma clave devuelve la operación guardada sin mover stock ni dinero otra vez. Si el importe no queda resuelto completo responde 409 return_operation_unsettled.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/CashIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReturnOperationInput'}
      responses:
        '201':
          description: Operación registrada, con la devolución, el cambio, el cobro, los descuentos del fiado y el reintegro.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SaleReturn'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/sales/{id}/return-operations/preview:
    post:
      operationId: previewReturnOperation
      summary: Calcular un cambio o devolución sin registrarlo.
      description: Devuelve el valor histórico de lo que vuelve, el precio vigente del reemplazo, la diferencia y cómo se resolvería (primero el saldo del fiado, luego el reintegro). No escribe nada. Los importes de cobro, reintegro y descuento se ignoran.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReturnOperationInput'}
      responses:
        '200':
          description: Cálculo del servidor.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReturnPreview'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/sales/{id}/returns:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: listSaleReturns
      summary: Consultar unidades vendidas, devueltas e historial de recepción.
      parameters:
        - $ref: '#/components/parameters/InventoryStoreQuery'
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, maximum: 100000, default: 0}
      responses:
        '200':
          description: Unidades e historial de la venta.
          content:
            application/json:
              schema:
                type: object
                required: [number, currency, items, returns, hasMore, canRefundCash, refundMethod, refundOptions]
                properties:
                  number: {type: string, pattern: '^[1-9][0-9]*$'}
                  currency: {type: string}
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ReturnableItem'}
                  returns:
                    type: array
                    items: {$ref: '#/components/schemas/SaleReturn'}
                  hasMore: {type: boolean}
                  canRefundCash: {type: boolean}
                  refundMethod:
                    description: Medio original en ventas pagadas con un único medio.
                    oneOf:
                      - $ref: '#/components/schemas/SalePaymentMethod'
                      - type: 'null'
                  refundOptions:
                    type: array
                    description: Saldo disponible para reintegrar por cada medio original.
                    items: {$ref: '#/components/schemas/RefundAllocation'}
                  deposit:
                    description: Seña aplicada a esta venta, cuando existe.
                    $ref: '#/components/schemas/RefundAllocation'
                  outstandingDebt:
                    description: Saldo vigente cuando la venta fue fiada.
                    $ref: '#/components/schemas/CashAmount'
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
    post:
      operationId: addSaleReturn
      summary: Recibir prendas de una venta confirmada o entregadas como reemplazo.
      description: Registra la recepción física y guarda el importe histórico de referencia. El destino debe ser una ubicación activa de la sucursal y coincidir con su condición vendible o de cuarentena. Cuando se indica el cambio de origen, se toman el precio y las unidades disponibles de ese reemplazo.
      parameters:
        - $ref: '#/components/parameters/CashIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [storeId, reason, items]
              properties:
                storeId: {type: string, format: uuid}
                sourceExchangeId:
                  description: Cambio de origen en esta misma venta. Se omite al recibir prendas de la venta original.
                  type: string
                  format: uuid
                reason: {type: string, minLength: 1, maxLength: 300}
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    required: [variantId, locationId, disposition, quantity]
                    properties:
                      variantId: {type: string, format: uuid}
                      locationId: {type: string, format: uuid}
                      disposition: {$ref: '#/components/schemas/ReturnDisposition'}
                      quantity: {type: integer, minimum: 1, maximum: 2147483647}
      responses:
        '201':
          description: Recepción registrada o recuperada por su clave de idempotencia.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SaleReturn'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/sales/{id}/returns/{return_id}/refund:
    post:
      operationId: addReturnRefund
      summary: Registrar un reintegro por una recepción de devolución.
      description: Usa el importe histórico de la recepción menos las compensaciones ya aplicadas. El saldo reintegrable por medio incluye la seña aplicada, los pagos al entregar y los abonos cobrados, menos los reintegros anteriores. Requiere una caja abierta de la sucursal. El efectivo se descuenta del arqueo y requiere saldo suficiente. Los reintegros electrónicos se registran después de realizarse en el canal original. En fiados y pagos mixtos, el desglose explícito debe cubrir el importe pendiente de la recepción y respetar el saldo cobrado por medio. Un reintento con los mismos datos devuelve el reintegro original. En una recepción de reemplazo se incluyen los cobros de la cadena de cambios, descontando sus reintegros previos.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: return_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/CashIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [storeId, cashSessionId]
              not:
                required: [method, payments]
              properties:
                storeId: {type: string, format: uuid}
                cashSessionId: {type: string, format: uuid}
                method:
                  $ref: '#/components/schemas/SalePaymentMethod'
                  default: cash
                  description: Medio original de una venta de un solo medio. Si se omiten method y payments, se interpreta efectivo.
                payments:
                  type: array
                  minItems: 1
                  maxItems: 5
                  description: Desglose explícito obligatorio en ventas fiadas o con varios medios de pago.
                  items: {$ref: '#/components/schemas/RefundAllocation'}
      responses:
        '201':
          description: Reintegro registrado o recuperado por su clave de idempotencia.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReturnRefund'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/sales/{id}/returns/{return_id}/debt-credits:
    post:
      operationId: addReturnDebtCredit
      summary: Aplicar parte de una devolución al saldo adeudado de la venta.
      description: El importe debe ser positivo y no superar el saldo actual del fiado ni el importe de la recepción pendiente de resolver después de compensaciones y reintegros. La operación no requiere una caja abierta. El reintento con la misma clave e importe devuelve el ajuste original. También se admite compensar una recepción de prendas entregadas como reemplazo.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: return_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/CashIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [storeId, amount]
              properties:
                storeId: {type: string, format: uuid}
                amount: {$ref: '#/components/schemas/CashAmount'}
      responses:
        '201':
          description: Compensación aplicada o recuperada por su clave de idempotencia.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReturnDebtCredit'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/sales/{id}/returns/{return_id}/exchange:
    post:
      operationId: addReturnExchange
      summary: Entregar prendas de reemplazo y resolver la diferencia.
      description: Valida los precios vigentes contra el importe histórico de una recepción pendiente. Un reemplazo de igual valor admite caja cerrada. Uno de mayor valor requiere registrar la diferencia en una caja abierta, con uno o varios medios. En un fiado, el nuevo cobro corresponde al cambio y el saldo original se conserva. En un cambio de menor valor, se puede aplicar parte o toda la diferencia al saldo vigente del fiado. El importe restante se reintegra por los medios originales en una caja abierta. Una recepción de reemplazos admite otro cambio por el mismo importe histórico o por uno mayor, cobrando la diferencia en una caja abierta. En otro cambio de menor valor, el importe reintegrable se cubre por los medios de la venta y los cobros de la cadena de cambios. En fiados, el operador puede aplicar parte o toda la diferencia a la deuda vigente. Una compensación completa admite caja cerrada.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: return_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/CashIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [storeId, locationId, items]
              not:
                anyOf:
                  - required: [charge, refund]
                  - required: [charge, debtCreditAmount]
              properties:
                storeId: {type: string, format: uuid}
                locationId: {type: string, format: uuid}
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    required: [variantId, quantity, expectedUnitPrice]
                    properties:
                      variantId: {type: string, format: uuid}
                      quantity: {type: integer, minimum: 1, maximum: 2147483647}
                      expectedUnitPrice: {$ref: '#/components/schemas/CashAmount'}
                charge:
                  type: object
                  additionalProperties: false
                  required: [cashSessionId]
                  oneOf:
                    - required: [method, amount]
                    - required: [payments]
                      not:
                        anyOf:
                          - required: [method]
                          - required: [amount]
                          - required: [cashReceived]
                  properties:
                    cashSessionId: {type: string, format: uuid}
                    method: {$ref: '#/components/schemas/SalePaymentMethod'}
                    amount: {$ref: '#/components/schemas/CashAmount'}
                    cashReceived: {$ref: '#/components/schemas/CashAmount'}
                    payments:
                      type: array
                      minItems: 1
                      maxItems: 5
                      description: Un importe por medio. Los importes deben sumar la diferencia.
                      items: {$ref: '#/components/schemas/ExchangeChargePaymentInput'}
                  if:
                    required: [method]
                    properties:
                      method: {const: cash}
                  then:
                    required: [cashReceived]
                  else:
                    not:
                      required: [cashReceived]
                debtCreditAmount:
                  description: Importe positivo aplicado al saldo del fiado. Debe estar dentro de la diferencia y del saldo vigente. Se omite cuando no hay compensación.
                  $ref: '#/components/schemas/CashAmount'
                refund:
                  type: object
                  additionalProperties: false
                  required: [cashSessionId, payments]
                  properties:
                    cashSessionId: {type: string, format: uuid}
                    payments:
                      type: array
                      minItems: 1
                      maxItems: 5
                      description: Importes reintegrados por los medios de cobro. Deben sumar la diferencia menos la compensación y respetar el saldo disponible por medio.
                      items: {$ref: '#/components/schemas/RefundAllocation'}
      responses:
        '201':
          description: Cambio registrado o recuperado por su clave de idempotencia. La compensación de deuda y el reintegro de una diferencia se consultan junto al cambio en el historial de devoluciones.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReturnExchange'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/sales/{id}/ticket:
    get:
      operationId: getSaleTicket
      summary: Consultar los datos guardados para imprimir o reimprimir un ticket interno.
      description: Requiere acceso vigente a la venta. La operación de lectura conserva caja, inventario y numeración.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/InventoryStoreQuery'
      responses:
        '200':
          description: Venta confirmada y datos históricos del comercio y la sucursal.
          content:
            application/json:
              schema:
                type: object
                required: [sale, merchantName, storeCode, storeName, storeAddress, timezone]
                properties:
                  sale: {$ref: '#/components/schemas/Sale'}
                  merchantName: {type: string}
                  storeCode: {type: string}
                  storeName: {type: string}
                  storeAddress: {type: string}
                  timezone: {type: string, examples: [America/Argentina/Tucuman]}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
components:
  requestBodies:
    StoreAction:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [storeId]
            properties:
              storeId: {type: string, format: uuid}
    ClassificationName:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name: {type: string, minLength: 1, maxLength: 120}
  parameters:
    SaleMethodQuery:
      name: method
      in: query
      description: Conserva las ventas cobradas, al menos en parte, con ese medio (seña incluida). on_credit conserva las ventas fiadas.
      schema: {type: string, enum: [cash, debit, credit, transfer, qr, on_credit]}
    CashSessionID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    CashIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9_.-]{1,128}$'}
    CountID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    TransferID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    InventoryStoreQuery:
      name: store_id
      in: query
      required: true
      schema: {type: string, format: uuid}
    ProductImageID:
      name: imageId
      in: path
      required: true
      schema: {type: string, format: uuid}
    PricingID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    PricingVariantID:
      name: variantId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ProductID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    CollectionsReport:
      type: object
      required: [timezone, methods, sources, daily, items, hasMore]
      properties:
        timezone: {type: string}
        hasMore: {type: boolean}
        methods:
          type: array
          items:
            type: object
            required: [currency, method, collected, refunded, net, count]
            properties:
              currency: {type: string}
              method: {type: string, enum: [cash, debit, credit, transfer, qr]}
              collected: {type: string}
              refunded: {type: string}
              net: {type: string}
              count: {type: integer}
        sources:
          type: array
          items:
            type: object
            required: [currency, source, amount, count]
            properties:
              currency: {type: string}
              source: {type: string, enum: [sale, deposit, receivable, exchange, refund]}
              amount: {type: string}
              count: {type: integer}
        daily:
          type: array
          description: Hasta los 31 días más recientes con movimientos.
          items:
            type: object
            required: [date, currency, collected, refunded]
            properties:
              date: {type: string, format: date}
              currency: {type: string}
              collected: {type: string}
              refunded: {type: string}
        items:
          type: array
          items:
            type: object
            required: [source, method, currency, amount, happenedAt, saleId, saleNumber, customer]
            properties:
              source: {type: string, enum: [sale, deposit, receivable, exchange, refund]}
              method: {type: string, enum: [cash, debit, credit, transfer, qr]}
              currency: {type: string}
              amount: {type: string, description: Negativo para reintegros.}
              happenedAt: {type: string, format: date-time}
              saleId: {type: [string, 'null'], format: uuid}
              saleNumber: {type: [string, 'null']}
              customer: {type: [string, 'null']}
    PurchasesReport:
      type: object
      required: [timezone, currency, summary, daily, suppliers, products, items, hasMore]
      properties:
        timezone: {type: string}
        currency: {type: string}
        hasMore: {type: boolean}
        summary:
          type: object
          required: [receiptCount, receivedOrders, units, unitsWithCost, rejectedUnits, knownCost, placedOrders, orderedUnits, pendingOrders]
          properties:
            receiptCount: {type: integer}
            receivedOrders: {type: integer}
            units: {type: integer}
            unitsWithCost: {type: integer}
            rejectedUnits: {type: integer}
            knownCost: {type: string}
            placedOrders: {type: integer, description: Órdenes emitidas en el período.}
            orderedUnits: {type: integer}
            pendingOrders: {type: integer, description: 'Órdenes abiertas o parciales hoy, sin depender del período.'}
        daily:
          type: array
          items:
            type: object
            required: [date, receiptCount, units, knownCost]
            properties:
              date: {type: string, format: date}
              receiptCount: {type: integer}
              units: {type: integer}
              knownCost: {type: string}
        suppliers:
          type: array
          maxItems: 10
          items:
            type: object
            required: [supplierId, supplier, receiptCount, units, knownCost]
            properties:
              supplierId: {type: string, format: uuid}
              supplier: {type: string}
              receiptCount: {type: integer}
              units: {type: integer}
              knownCost: {type: string}
        products:
          type: array
          maxItems: 10
          items:
            type: object
            required: [productId, product, units, knownCost]
            properties:
              productId: {type: string, format: uuid}
              product: {type: string}
              units: {type: integer}
              knownCost: {type: string}
        items:
          type: array
          items:
            type: object
            required: [receiptId, orderId, orderNumber, supplier, locationName, receivedAt, units, rejectedUnits, knownCost, unitsWithoutCost]
            properties:
              receiptId: {type: string, format: uuid}
              orderId: {type: string, format: uuid}
              orderNumber: {type: [integer, 'null']}
              supplier: {type: string}
              locationName: {type: string}
              receivedAt: {type: string, format: date-time}
              units: {type: integer}
              rejectedUnits: {type: integer}
              knownCost: {type: string}
              unitsWithoutCost: {type: integer}
    PurchaseOrder:
      type: object
      required: [id, number, storeId, supplierId, supplierName, reference, currency, status, orderedAt, createdBy, cancelledAt, cancelReason, items,
        payable, paid, balance, paymentStatus, payments]
      properties:
        payable:
          description: 'Total a los costos acordados: lo pedido, o solo lo aceptado si el pedido se canceló. Nulo si un renglón que cuenta no tiene costo.'
          oneOf:
            - $ref: '#/components/schemas/CashAmount'
            - type: 'null'
        paid: {$ref: '#/components/schemas/CashAmount'}
        balance:
          description: Total menos lo pagado. Negativo es saldo a favor. Nulo sin total.
          type: [string, 'null']
          pattern: '^-?\d{1,16}\.\d{2}$'
        paymentStatus: {type: string, enum: [unknown, none, unpaid, partial, paid, credit]}
        payments:
          type: array
          items: {$ref: '#/components/schemas/SupplierPayment'}
        id: {type: string, format: uuid}
        number: {type: integer, minimum: 1, description: 'Número correlativo del comercio, mostrado como OC-0001.'}
        storeId: {type: string, format: uuid}
        supplierId: {type: string, format: uuid}
        supplierName: {type: string}
        reference: {type: string}
        currency: {type: string}
        status: {type: string, enum: [OPEN, PARTIALLY_RECEIVED, RECEIVED, CANCELLED]}
        orderedAt: {type: string, format: date-time}
        createdBy: {type: string, format: uuid}
        cancelledAt: {type: [string, 'null'], format: date-time}
        cancelReason: {type: string}
        items:
          type: array
          items:
            type: object
            required: [id, variantId, productId, product, sku, size, color, quantity, received, rejected, unitCost]
            properties:
              id: {type: string, format: uuid}
              variantId: {type: string, format: uuid}
              productId: {type: string, format: uuid}
              rejected: {type: integer, minimum: 0, description: Unidades no aceptadas en todas las recepciones.}
              product: {type: string}
              sku: {type: string}
              size: {type: string}
              color: {type: string}
              quantity: {type: integer, minimum: 1, maximum: 2147483647}
              received: {type: integer, minimum: 0, maximum: 2147483647}
              unitCost:
                oneOf:
                  - $ref: '#/components/schemas/CashAmount'
                  - type: 'null'
    SupplierPayment:
      type: object
      required: [id, method, amount, paidOn, checkDueOn, reference, note, createdBy, createdAt, voidedAt, voidReason]
      properties:
        id: {type: string, format: uuid}
        method: {type: string, enum: [cash, transfer, check, card, other]}
        amount: {$ref: '#/components/schemas/CashAmount'}
        paidOn: {type: string, format: date}
        checkDueOn: {type: [string, 'null'], format: date}
        reference: {type: string}
        note: {type: string}
        createdBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        voidedAt: {type: [string, 'null'], format: date-time}
        voidReason: {type: string}
    PurchaseReceipt:
      type: object
      required: [id, orderId, locationId, locationName, note, receivedAt, receivedBy, items]
      properties:
        id: {type: string, format: uuid}
        orderId: {type: string, format: uuid}
        locationId: {type: string, format: uuid}
        locationName: {type: string}
        note: {type: string}
        receivedAt: {type: string, format: date-time}
        receivedBy: {type: string, format: uuid}
        items:
          type: array
          items:
            type: object
            required: [orderItemId, variantId, sku, product, size, color, accepted, rejected, rejectionReason, unitCost, stockBefore, stockAfter]
            properties:
              orderItemId: {type: string, format: uuid}
              variantId: {type: string, format: uuid}
              sku: {type: string}
              product: {type: string}
              size: {type: string}
              color: {type: string}
              accepted: {type: integer, minimum: 0, maximum: 2147483647}
              rejected: {type: integer, minimum: 0, maximum: 2147483647}
              rejectionReason: {type: [string, 'null'], enum: [damaged, wrong_item, excess, other, null], description: Nulo sin unidades no aceptadas o en recepciones anteriores a la migración 046.}
              stockBefore: {type: [integer, 'null'], description: Existencia de la ubicación antes del movimiento de ingreso; nulo si no hubo unidades aceptadas.}
              stockAfter: {type: [integer, 'null']}
              unitCost:
                oneOf:
                  - $ref: '#/components/schemas/CashAmount'
                  - type: 'null'
    Supplier:
      type: object
      required: [id, name, email, phone, status, taxId, contactName]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        email: {type: string}
        phone: {type: string}
        status: {type: string, enum: [active, inactive]}
        taxId: {type: string}
        contactName: {type: string}
    Customer:
      type: object
      required: [id, name, phone]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        phone: {type: string}
    SaleCredit:
      type: object
      required: [id, customerId, customerName, originalAmount]
      properties:
        id: {type: string, format: uuid}
        customerId: {type: string, format: uuid}
        customerName: {type: string}
        originalAmount: {$ref: '#/components/schemas/CashAmount'}
    RecentReceivablePayment:
      type: object
      required: [id, saleId, saleNumber, customerName, currency, method, amount, createdAt]
      properties:
        id: {type: string, format: uuid}
        saleId: {type: string, format: uuid}
        saleNumber: {type: string, pattern: '^[1-9][0-9]*$'}
        customerName: {type: string}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        method: {$ref: '#/components/schemas/SalePaymentMethod'}
        amount: {$ref: '#/components/schemas/CashAmount'}
        createdAt: {type: string, format: date-time}
    ReceivableSummary:
      type: object
      required: [currency, pendingCount, settledCount, outstanding, collected, debtCredits, paymentsByMethod, topDebtors]
      properties:
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        pendingCount: {type: integer, format: int64, minimum: 0}
        settledCount: {type: integer, format: int64, minimum: 0}
        outstanding: {type: string, pattern: '^\d+\.\d{2}$'}
        collected: {type: string, pattern: '^\d+\.\d{2}$', description: Abonos posteriores a la venta.}
        debtCredits: {type: string, pattern: '^\d+\.\d{2}$', description: Importe aplicado como compensación de deuda.}
        topDebtors:
          type: array
          maxItems: 10
          description: Clientes con mayor saldo pendiente dentro de la búsqueda, en la moneda del resumen.
          items:
            type: object
            required: [customerId, customerName, pendingCount, outstanding]
            properties:
              customerId: {type: string, format: uuid}
              customerName: {type: string}
              pendingCount: {type: integer, format: int64, minimum: 1}
              outstanding: {type: string, pattern: '^\d+\.\d{2}$'}
        paymentsByMethod:
          type: array
          description: Abonos registrados por medio de pago. Vacío si las cuentas no tienen abonos.
          items:
            type: object
            required: [method, paymentCount, amount]
            properties:
              method: {$ref: '#/components/schemas/SalePaymentMethod'}
              paymentCount: {type: integer, format: int64, minimum: 1}
              amount: {type: string, pattern: '^\d+\.\d{2}$'}
    Receivable:
      allOf:
        - $ref: '#/components/schemas/SaleCredit'
        - type: object
          required: [saleId, saleNumber, currency, outstandingAmount, createdAt]
          properties:
            saleId: {type: string, format: uuid}
            saleNumber: {type: string, pattern: '^[1-9][0-9]*$'}
            currency: {type: string, examples: [ARS]}
            outstandingAmount: {$ref: '#/components/schemas/CashAmount'}
            createdAt: {type: string, format: date-time}
    ReceivablePayment:
      type: object
      required: [id, receivableId, cashSessionId, method, amount, balanceAfter, createdBy, createdAt]
      properties:
        id: {type: string, format: uuid}
        receivableId: {type: string, format: uuid}
        cashSessionId: {type: string, format: uuid}
        method: {$ref: '#/components/schemas/SalePaymentMethod'}
        amount: {$ref: '#/components/schemas/CashAmount'}
        balanceAfter: {$ref: '#/components/schemas/CashAmount'}
        createdBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
    ReservationStatus:
      type: string
      enum: [ACTIVE, FULFILLED, CANCELLED, EXPIRED]
    ReservationQuantity:
      type: object
      additionalProperties: false
      required: [variantId, quantity]
      properties:
        variantId: {type: string, format: uuid}
        quantity: {type: integer, minimum: 1, maximum: 2147483647}
    Reservation:
      type: object
      required: [id, storeId, locationId, locationName, customerId, customerName, status, createdAt, expiresAt, closedAt, saleId, items, deposit]
      properties:
        id: {type: string, format: uuid}
        storeId: {type: string, format: uuid}
        locationId: {type: string, format: uuid}
        locationName: {type: string}
        customerId: {type: string, format: uuid}
        customerName: {type: string}
        status: {$ref: '#/components/schemas/ReservationStatus'}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: [string, 'null'], format: date-time}
        closedAt: {type: [string, 'null'], format: date-time}
        saleId: {type: [string, 'null'], format: uuid}
        deposit:
          oneOf:
            - $ref: '#/components/schemas/ReservationDeposit'
            - type: 'null'
        items:
          type: array
          items:
            type: object
            required: [variantId, quantity, product, sku, size, color]
            properties:
              variantId: {type: string, format: uuid}
              quantity: {type: integer, minimum: 1}
              product: {type: string}
              sku: {type: string}
              size: {type: string}
              color: {type: string}
    ReservationDeposit:
      type: object
      required: [id, cashSessionId, method, amount, createdBy, createdAt]
      properties:
        id: {type: string, format: uuid}
        cashSessionId: {type: string, format: uuid}
        method: {$ref: '#/components/schemas/SalePaymentMethod'}
        amount: {$ref: '#/components/schemas/CashAmount'}
        createdBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
    ReturnDisposition:
      type: string
      enum: [sellable, quarantine]
    ReturnableItem:
      type: object
      required: [variantId, product, sku, size, color, unitPrice, sold, returned]
      properties:
        variantId: {type: string, format: uuid}
        product: {type: string}
        sku: {type: string}
        size: {type: string}
        color: {type: string}
        unitPrice: {$ref: '#/components/schemas/CashAmount'}
        sold: {type: integer, minimum: 1}
        returned: {type: integer, minimum: 0}
    SaleReturn:
      type: object
      required: [id, saleId, reason, referenceAmount, createdBy, createdAt, items]
      properties:
        id: {type: string, format: uuid}
        saleId: {type: string, format: uuid}
        sourceExchangeId: {type: string, format: uuid}
        reason: {type: string}
        referenceAmount: {$ref: '#/components/schemas/CashAmount'}
        exchangeRefundOptions:
          description: Saldo disponible por medio para un reintegro directo o un cambio de menor valor desde una recepción de reemplazo pendiente.
          type: array
          items: {$ref: '#/components/schemas/RefundAllocation'}
        refund: {$ref: '#/components/schemas/ReturnRefund'}
        exchange: {$ref: '#/components/schemas/ReturnExchange'}
        debtCredits:
          type: array
          items: {$ref: '#/components/schemas/ReturnDebtCredit'}
        createdBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        items:
          type: array
          items:
            type: object
            required: [variantId, locationId, locationName, disposition, quantity, product, sku, unitPrice]
            properties:
              variantId: {type: string, format: uuid}
              locationId: {type: string, format: uuid}
              locationName: {type: string}
              disposition: {$ref: '#/components/schemas/ReturnDisposition'}
              quantity: {type: integer, minimum: 1}
              product: {type: string}
              sku: {type: string}
              unitPrice: {$ref: '#/components/schemas/CashAmount'}
    ExchangeChargePaymentInput:
      type: object
      additionalProperties: false
      required: [method, amount]
      properties:
        method: {$ref: '#/components/schemas/SalePaymentMethod'}
        amount: {$ref: '#/components/schemas/CashAmount'}
        cashReceived: {$ref: '#/components/schemas/CashAmount'}
      if:
        properties:
          method: {const: cash}
      then:
        required: [cashReceived]
      else:
        not:
          required: [cashReceived]
    ReturnExchange:
      type: object
      required: [id, returnId, locationId, locationName, total, createdBy, createdAt, items]
      properties:
        id: {type: string, format: uuid}
        returnId: {type: string, format: uuid}
        locationId: {type: string, format: uuid}
        locationName: {type: string}
        total: {$ref: '#/components/schemas/CashAmount'}
        returnedQuantities:
          description: Unidades devueltas por ID de variante, visibles en el historial cuando hubo recepciones de reemplazos.
          type: object
          additionalProperties: {type: integer, minimum: 1}
        charge:
          type: object
          required: [cashSessionId, method, amount, payments]
          properties:
            cashSessionId: {type: string, format: uuid}
            method:
              oneOf:
                - $ref: '#/components/schemas/SalePaymentMethod'
                - type: 'null'
            payments:
              type: array
              minItems: 1
              items:
                type: object
                required: [method, amount]
                properties:
                  method: {$ref: '#/components/schemas/SalePaymentMethod'}
                  amount: {$ref: '#/components/schemas/CashAmount'}
                  cashReceived: {$ref: '#/components/schemas/CashAmount'}
                  change: {$ref: '#/components/schemas/CashAmount'}
            amount: {$ref: '#/components/schemas/CashAmount'}
            cashReceived: {$ref: '#/components/schemas/CashAmount'}
            change: {$ref: '#/components/schemas/CashAmount'}
        createdBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        items:
          type: array
          items:
            type: object
            required: [variantId, product, sku, size, color, quantity, unitPrice, subtotal, unitCostSnapshot, discountPercent, listUnitPrice]
            properties:
              variantId: {type: string, format: uuid}
              product: {type: string}
              sku: {type: string}
              size: {type: string}
              color: {type: string}
              quantity: {type: integer, minimum: 1}
              unitPrice: {$ref: '#/components/schemas/CashAmount'}
              subtotal: {$ref: '#/components/schemas/CashAmount'}
              discountPercent: {type: integer, minimum: 0, maximum: 80}
              listUnitPrice: {type: [string, 'null'], description: Precio de lista cuando se aplicó un descuento.}
              unitCostSnapshot: {type: [string, 'null'], pattern: '^\\d{1,16}\\.\\d{2}$', description: Costo promedio vigente al confirmar la venta; null cuando es desconocido.}
    ReturnDebtCredit:
      type: object
      required: [id, returnId, amount, balanceAfter, createdBy, createdAt]
      properties:
        id: {type: string, format: uuid}
        returnId: {type: string, format: uuid}
        amount: {$ref: '#/components/schemas/CashAmount'}
        balanceAfter: {$ref: '#/components/schemas/CashAmount'}
        createdBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
    RefundAllocation:
      type: object
      additionalProperties: false
      required: [method, amount]
      properties:
        method: {$ref: '#/components/schemas/SalePaymentMethod'}
        amount: {$ref: '#/components/schemas/CashAmount'}
    ReturnRefund:
      type: object
      required: [id, returnId, cashSessionId, method, amount, createdBy, createdAt, payments]
      properties:
        id: {type: string, format: uuid}
        returnId: {type: string, format: uuid}
        cashSessionId: {type: string, format: uuid}
        method:
          oneOf:
            - $ref: '#/components/schemas/SalePaymentMethod'
            - type: 'null'
        payments:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/RefundAllocation'}
        amount: {$ref: '#/components/schemas/CashAmount'}
        createdBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
    SaleSummary:
      type: object
      required: [id, number, total, currency, createdAt]
      properties:
        id: {type: string, format: uuid}
        number: {type: string, pattern: '^[1-9][0-9]*$'}
        total: {$ref: '#/components/schemas/CashAmount'}
        currency: {type: string, examples: [ARS]}
        createdAt: {type: string, format: date-time}
        customer: {type: [string, 'null'], description: Cliente de la venta fiada o de la reserva cumplida; nulo para consumidor final.}
        units: {type: integer, minimum: 0}
        products: {type: string, description: 'Nombres de los productos vendidos, separados por coma.'}
        returns: {type: integer, minimum: 0, description: Cantidad de cambios y devoluciones vinculados.}
        onCredit: {type: boolean}
        payments:
          type: array
          description: Medios cobrados al confirmar, incluida la seña de una reserva. Vacío para una venta fiada sin pago.
          items: {type: string, enum: [cash, transfer, debit, credit, qr]}
    ReturnOperationInput:
      type: object
      additionalProperties: false
      required: [storeId, reason, items]
      description: Un cambio o devolución completo. Todo el importe de lo que vuelve se resuelve en la misma operación con el reemplazo, el cobro de la diferencia, el descuento del fiado o el reintegro.
      properties:
        storeId: {type: string, format: uuid}
        reason: {type: string, minLength: 1, maxLength: 300}
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [variantId, quantity, locationId, disposition]
            properties:
              variantId: {type: string, format: uuid}
              quantity: {type: integer, minimum: 1}
              locationId: {type: string, format: uuid, description: Ubicación vendible para sellable; no vendible para quarantine.}
              disposition: {type: string, enum: [sellable, quarantine]}
        exchange:
          type: object
          additionalProperties: false
          required: [locationId, items]
          properties:
            locationId: {type: string, format: uuid}
            items:
              type: array
              minItems: 1
              maxItems: 100
              items:
                type: object
                required: [variantId, quantity, expectedUnitPrice]
                properties:
                  variantId: {type: string, format: uuid}
                  quantity: {type: integer, minimum: 1}
                  expectedUnitPrice: {$ref: '#/components/schemas/CashAmount'}
        charge:
          type: object
          description: Cobro de la diferencia cuando el reemplazo vale más. Mismo formato que el cobro de POST /sales/{id}/returns/{return_id}/exchange.
        refund:
          type: object
          required: [cashSessionId, payments]
          properties:
            cashSessionId: {type: string, format: uuid}
            payments:
              type: array
              minItems: 1
              maxItems: 5
              items:
                type: object
                required: [method, amount]
                properties:
                  method: {$ref: '#/components/schemas/SalePaymentMethod'}
                  amount: {$ref: '#/components/schemas/CashAmount'}
        debtCreditAmount: {$ref: '#/components/schemas/CashAmount'}
    ReturnPreview:
      type: object
      required: [currency, returnAmount, replacementTotal, replacements, difference, charge, debtCredit, refund, outstandingDebt, refundOptions]
      properties:
        currency: {type: string}
        returnAmount: {$ref: '#/components/schemas/CashAmount'}
        replacementTotal: {$ref: '#/components/schemas/CashAmount'}
        replacements:
          type: array
          items: {type: object, description: 'Línea cotizada con el precio vigente, como en las ventas.'}
        difference: {type: string, pattern: '^-?\d+\.\d{2}$', description: Reemplazo menos devuelto. Negativo si queda a favor del cliente.}
        charge: {$ref: '#/components/schemas/CashAmount'}
        debtCredit: {$ref: '#/components/schemas/CashAmount'}
        refund: {$ref: '#/components/schemas/CashAmount'}
        outstandingDebt: {type: [string, 'null']}
        refundOptions:
          type: array
          items:
            type: object
            required: [method, amount]
            properties:
              method: {$ref: '#/components/schemas/SalePaymentMethod'}
              amount: {$ref: '#/components/schemas/CashAmount'}
    SalesDailyTotal:
      type: object
      required: [date, currency, saleCount, unitsSold, netSales]
      properties:
        date: {type: string, format: date}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        saleCount: {type: integer, format: int64, minimum: 1}
        unitsSold: {type: integer, format: int64, minimum: 1}
        netSales: {type: string, pattern: '^\d+\.\d{2}$'}
    SalesPaymentTotal:
      type: object
      required: [currency, method, amount, saleCount]
      properties:
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        method:
          oneOf:
            - $ref: '#/components/schemas/SalePaymentMethod'
            - const: on_credit
        amount: {type: string, pattern: '^\d+\.\d{2}$'}
        saleCount: {type: integer, format: int64, minimum: 1, description: Una venta puede aparecer en varios medios.}
    SalesActivity:
      type: object
      required: [currency, saleCount, unitsSold, grossSales, averageTicket, returnCount, returnedUnits, returnedAmount, exchangeCount, exchangedUnits, exchangeAmount, netUnits, netSales]
      properties:
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        saleCount: {type: integer, format: int64, minimum: 0}
        unitsSold: {type: integer, format: int64, minimum: 0}
        grossSales: {type: string, description: 'Importe de las líneas vendidas, neto de descuentos.'}
        averageTicket: {type: [string, 'null'], description: grossSales / saleCount; nulo sin ventas en el período.}
        returnCount: {type: integer, format: int64, minimum: 0}
        returnedUnits: {type: integer, format: int64, minimum: 0}
        returnedAmount: {type: string, description: Valor de lo devuelto al precio cobrado.}
        exchangeCount: {type: integer, format: int64, minimum: 0}
        exchangedUnits: {type: integer, format: int64, minimum: 0}
        exchangeAmount: {type: string, description: Valor de los reemplazos entregados en cambios.}
        netUnits: {type: integer, format: int64}
        netSales: {type: string, description: grossSales − returnedAmount + exchangeAmount.}
    TopSoldProduct:
      type: object
      required: [currency, productId, product, unitsSold, returnedUnits, netUnits, netSales]
      properties:
        currency: {type: string}
        productId: {type: string, format: uuid}
        product: {type: string}
        unitsSold: {type: integer, format: int64, minimum: 0, description: Vendidas y entregadas en cambios.}
        returnedUnits: {type: integer, format: int64, minimum: 0}
        netUnits: {type: integer, format: int64, minimum: 1}
        netSales: {type: string}
    TopSoldVariant:
      type: object
      required: [variantId, sku, product, size, color, unitsSold]
      properties:
        variantId: {type: string, format: uuid}
        sku: {type: string}
        product: {type: string}
        size: {type: string}
        color: {type: string}
        unitsSold: {type: integer, format: int64, minimum: 1}
    SalesMarginSummary:
      type: object
      required: [currency, lineCount, unknownCostLines, netSales, netSalesWithCost, netSalesWithoutCost, costOfGoodsWithCost, grossProfitWithCost, grossMarginPercentWithCost]
      properties:
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        lineCount: {type: integer, format: int64, minimum: 1}
        unknownCostLines: {type: integer, format: int64, minimum: 0}
        netSales: {type: string, pattern: '^\d+\.\d{2}$'}
        netSalesWithCost: {type: string, pattern: '^\d+\.\d{2}$'}
        netSalesWithoutCost: {type: string, pattern: '^\d+\.\d{2}$'}
        costOfGoodsWithCost: {type: [string, 'null'], pattern: '^\d+\.\d{2}$'}
        grossProfitWithCost: {type: [string, 'null'], pattern: '^-?\d+\.\d{2}$'}
        grossMarginPercentWithCost: {type: [string, 'null'], pattern: '^-?\d+\.\d{4}$'}
    SalesMarginLine:
      type: object
      required: [saleId, saleNumber, soldAt, currency, variantId, sku, product, quantity, netSales, costStatus, unitCostSnapshot, costOfGoods, grossProfit, grossMarginPercent]
      properties:
        saleId: {type: string, format: uuid}
        saleNumber: {type: string, pattern: '^[1-9][0-9]*$'}
        soldAt: {type: string, format: date-time}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        variantId: {type: string, format: uuid}
        sku: {type: string}
        product: {type: string}
        quantity: {type: integer, minimum: 1}
        netSales: {$ref: '#/components/schemas/CashAmount'}
        costStatus: {type: string, enum: [known, unknown]}
        unitCostSnapshot: {type: [string, 'null'], pattern: '^\\d{1,16}\\.\\d{2}$'}
        costOfGoods: {type: [string, 'null'], pattern: '^\\d+\\.\\d{2}$'}
        grossProfit: {type: [string, 'null'], pattern: '^-?\\d+\\.\\d{2}$'}
        grossMarginPercent: {type: [string, 'null'], pattern: '^-?\\d+\\.\\d{4}$'}
    Sale:
      type: object
      required: [id, storeId, cashSessionId, locationId, number, currency, total, cashReceived, change, createdBy, createdAt, items, payments]
      properties:
        id: {type: string, format: uuid}
        storeId: {type: string, format: uuid}
        cashSessionId: {type: string, format: uuid}
        locationId: {type: string, format: uuid}
        number: {type: string, pattern: '^[1-9][0-9]*$'}
        currency: {type: string, examples: [ARS]}
        total: {$ref: '#/components/schemas/CashAmount'}
        cashReceived: {$ref: '#/components/schemas/CashAmount'}
        change: {$ref: '#/components/schemas/CashAmount'}
        payments:
          type: array
          items:
            type: object
            required: [method, amount]
            properties:
              method: {$ref: '#/components/schemas/SalePaymentMethod'}
              amount: {$ref: '#/components/schemas/CashAmount'}
        deposit:
          type: object
          required: [method, amount]
          properties:
            method: {$ref: '#/components/schemas/SalePaymentMethod'}
            amount: {$ref: '#/components/schemas/CashAmount'}
        credit: {$ref: '#/components/schemas/SaleCredit'}
        createdBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        items:
          type: array
          items:
            type: object
            required: [variantId, product, sku, size, color, quantity, unitPrice, subtotal]
            properties:
              variantId: {type: string, format: uuid}
              product: {type: string}
              sku: {type: string}
              size: {type: string}
              color: {type: string}
              quantity: {type: integer, minimum: 1}
              unitPrice: {$ref: '#/components/schemas/CashAmount'}
              subtotal: {$ref: '#/components/schemas/CashAmount'}
    SalePaymentMethod:
      type: string
      enum: [cash, transfer, debit, credit, qr]
    CashAmount:
      type: string
      pattern: '^(0|[1-9][0-9]{0,15})(\.[0-9]{1,2})?$'
      examples: ['100.50', '0.00']
    CashRegister:
      type: object
      required: [id, code, name, occupied, openSessionId]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        occupied: {type: boolean}
        openSessionId: {type: [string, 'null'], format: uuid}
    CashSession:
      type: object
      required: [id, registerId, openedBy, openedAt, openingCash, status, expectedCash, declaredCash, difference, closedBy, closedAt]
      properties:
        id: {type: string, format: uuid}
        registerId: {type: string, format: uuid}
        openedBy: {type: string, format: uuid}
        openedAt: {type: string, format: date-time}
        openingCash: {$ref: '#/components/schemas/CashAmount'}
        status: {type: string, enum: [OPEN, CLOSED]}
        expectedCash: {$ref: '#/components/schemas/CashAmount'}
        declaredCash:
          oneOf:
            - $ref: '#/components/schemas/CashAmount'
            - type: 'null'
        difference: {type: [string, 'null'], pattern: '^-?[0-9]+\.[0-9]{2}$'}
        closedBy: {type: [string, 'null'], format: uuid}
        closedAt: {type: [string, 'null'], format: date-time}
    CashMovement:
      type: object
      required: [id, sessionId, actorId, type, amount, reason, createdAt, saleId]
      properties:
        id: {type: string, format: uuid}
        sessionId: {type: string, format: uuid}
        actorId: {type: string, format: uuid}
        type: {type: string, enum: [manual_in, manual_out, sale_cash, receivable_cash, reservation_deposit_cash, sale_refund_cash, sale_exchange_cash]}
        amount: {type: string, pattern: '^-?[0-9]+\.[0-9]{2}$'}
        reason: {type: string}
        createdAt: {type: string, format: date-time}
        saleId: {type: [string, 'null'], format: uuid}
    CountSummary:
      type: object
      required: [id, locationId, status, createdBy, createdAt, completedBy, completedAt, cancelledAt, note]
      properties:
        id: {type: string, format: uuid}
        locationId: {type: string, format: uuid}
        status: {type: string, enum: [DRAFT, COMPLETED, CANCELLED]}
        createdBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        completedBy: {type: [string, 'null'], format: uuid}
        completedAt: {type: [string, 'null'], format: date-time}
        cancelledAt: {type: [string, 'null'], format: date-time}
        note: {type: string}
        location: {type: string}
        locationActive: {type: boolean}
        store: {type: string}
        creator: {type: string}
        closer: {type: [string, 'null']}
        historicalLabels: {type: boolean}
        revision: {type: integer, minimum: 0}
        lineCount: {type: integer, minimum: 0}
        countedCount: {type: integer, minimum: 0}
    StockCount:
      allOf:
        - $ref: '#/components/schemas/CountSummary'
        - type: object
          required: [items, movements]
          properties:
            items:
              type: array
              items:
                type: object
                required: [variantId, sku, expected, counted]
                properties:
                  variantId: {type: string, format: uuid}
                  sku: {type: string}
                  expected: {type: integer, minimum: 0}
                  counted: {type: [integer, 'null'], minimum: 0}
                  product: {type: string}
                  size: {type: string}
                  color: {type: string}
                  note: {type: string}
                  historicalLabels: {type: boolean}
                  expectedRecorded: {type: boolean}
            movements:
              type: array
              items:
                type: object
                required: [id, variantId, delta]
                properties:
                  id: {type: string, format: uuid}
                  variantId: {type: string, format: uuid}
                  delta: {type: integer, format: int32}
    CountHistory:
      type: object
      required: [items, locations, timezone, canCount, hasMore]
      properties:
        items:
          type: array
          maxItems: 25
          items: {$ref: '#/components/schemas/CountSummary'}
        locations:
          type: array
          items:
            type: object
            required: [id, name, active]
            properties:
              id: {type: string, format: uuid}
              name: {type: string}
              active: {type: boolean}
        timezone: {type: string}
        canCount: {type: boolean}
        hasMore: {type: boolean}
    CountDraftWrite:
      type: object
      additionalProperties: false
      required: [storeId, expectedRevision, items]
      properties:
        storeId: {type: string, format: uuid}
        expectedRevision: {type: integer, minimum: 0}
        items:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [variantId]
            properties:
              variantId: {type: string, format: uuid}
              counted: {type: [integer, 'null'], minimum: 0, maximum: 2147483647}
              note: {type: string, maxLength: 300}
    CountStockReference:
      type: object
      required: [variantId, stockRevision]
      properties:
        variantId: {type: string, format: uuid}
        stockRevision: {type: string, pattern: '^(unrecorded|0|[1-9][0-9]{0,18})$'}
    CountCloseWrite:
      type: object
      additionalProperties: false
      required: [storeId, expectedRevision, references]
      properties:
        storeId: {type: string, format: uuid}
        expectedRevision: {type: integer, minimum: 0}
        references:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: '#/components/schemas/CountStockReference'}
    CountReview:
      type: object
      required: [revision, items]
      properties:
        revision: {type: integer, minimum: 0}
        items:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/CountStockReference'
              - type: object
                required: [current, reserved, counted, delta, blocked]
                properties:
                  current: {type: [integer, 'null'], minimum: 0}
                  reserved: {type: integer, minimum: 0}
                  counted: {type: integer, minimum: 0}
                  delta: {type: integer, format: int32}
                  blocked: {type: boolean}
    TransferLocation:
      type: object
      required: [id, storeId, name, code, storeName]
      properties:
        id: {type: string, format: uuid}
        storeId: {type: string, format: uuid}
        name: {type: string}
        code: {type: string}
        storeName: {type: string}
    TransferSummary:
      type: object
      required: [id, origin, destination, status, createdAt, dispatchedAt, receivedAt, cancelledAt, receiptReason]
      properties:
        id: {type: string, format: uuid}
        origin: {$ref: '#/components/schemas/TransferLocation'}
        destination: {$ref: '#/components/schemas/TransferLocation'}
        status: {type: string, enum: [DRAFT, DISPATCHED, RECEIVED, CANCELLED]}
        createdAt: {type: string, format: date-time}
        dispatchedAt: {type: [string, 'null'], format: date-time}
        receivedAt: {type: [string, 'null'], format: date-time}
        cancelledAt: {type: [string, 'null'], format: date-time}
        receiptReason: {type: string}
    StockTransfer:
      allOf:
        - $ref: '#/components/schemas/TransferSummary'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                type: object
                required: [variantId, sku, quantity, received]
                properties:
                  variantId: {type: string, format: uuid}
                  sku: {type: string}
                  quantity: {type: integer, minimum: 1}
                  received: {type: [integer, 'null'], minimum: 0}
    StockLocation:
      type: object
      required: [id, storeId, code, name, type, isSellable]
      properties:
        id: {type: string, format: uuid}
        storeId: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        type: {type: string, enum: [sales_floor, warehouse]}
        isSellable: {type: boolean}
    InventoryValuationAmounts:
      type: object
      required: [unitsWithCost, unitsWithoutCost, knownValue, totalValue]
      properties:
        unitsWithCost: {type: integer, format: int64, minimum: 0}
        unitsWithoutCost: {type: integer, format: int64, minimum: 0}
        knownValue: {type: [string, 'null'], pattern: '^\d+\.\d{2}$', description: Valor de las unidades con costo conocido. Null si no hay unidades valuadas.}
        totalValue: {type: [string, 'null'], pattern: '^\d+\.\d{2}$', description: Valuación completa. Null si hay stock sin costo.}
    ExistenceRow:
      type: object
      required: [productId, product, productStatus, variantId, variantStatus, sku, size, color, onHand, reserved, sellable, lowStock, recordedLocations, minimum]
      properties:
        productId: {type: string, format: uuid}
        product: {type: string}
        productStatus: {type: string, enum: [active, inactive]}
        variantId: {type: [string, 'null'], format: uuid}
        variantStatus: {type: [string, 'null'], enum: [active, inactive, null]}
        sku: {type: string}
        size: {type: string}
        color: {type: string}
        onHand: {type: [integer, 'null']}
        reserved: {type: [integer, 'null']}
        sellable: {type: [integer, 'null']}
        lowStock: {type: boolean}
        recordedLocations: {type: integer, minimum: 0}
        minimum: {type: [integer, 'null'], description: Mínimo en la ubicación filtrada.}
        barcode: {type: string, description: Código de barras principal o vacío.}
        unitCost: {type: [string, 'null'], description: Costo promedio de la sucursal; nulo si se desconoce o si no hay purchases:read.}
        costValue: {type: [string, 'null'], description: Unidades físicas por costo unitario.}
        unitPrice: {type: [string, 'null'], description: Precio de la lista de la sucursal.}
        retailValue: {type: [string, 'null']}
    ExistenceLocation:
      type: object
      required: [id, name, code, active, isSellable, onHand, reserved, sellable, minimum, lowStock, revision, minimumVersion]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        code: {type: string}
        active: {type: boolean}
        isSellable: {type: boolean}
        onHand: {type: [integer, 'null']}
        reserved: {type: [integer, 'null']}
        sellable: {type: [integer, 'null']}
        minimum: {type: [integer, 'null']}
        lowStock: {type: boolean}
        revision: {type: [string, 'null'], description: Token de revisión del saldo físico y reservado.}
        minimumVersion: {type: [string, 'null'], description: Token del mínimo configurado.}
    ExistenceAccess:
      type: object
      required: [canAdjust, canManageMinimums, canManageLocations, canTransfer, canCatalog]
      properties:
        canAdjust: {type: boolean}
        canManageMinimums: {type: boolean}
        canManageLocations: {type: boolean}
        canTransfer: {type: boolean}
        canCatalog: {type: boolean}
        canSeeCosts: {type: boolean, description: purchases:read.}
        canSetCosts: {type: boolean, description: purchases:manage.}
    ExistencePage:
      type: object
      required: [items, summary, access, hasMore]
      properties:
        items:
          type: array
          maxItems: 25
          items: {$ref: '#/components/schemas/ExistenceRow'}
        summary:
          type: object
          required: [productsWithStock, variantsSellable, variantsZero, variantsUnrecorded, variantsLow]
          properties:
            productsWithStock: {type: integer, minimum: 0}
            variantsSellable: {type: integer, minimum: 0}
            variantsZero: {type: integer, minimum: 0}
            variantsUnrecorded: {type: integer, minimum: 0}
            variantsLow: {type: integer, minimum: 0}
            units: {type: integer, minimum: 0, description: Unidades físicas de los resultados.}
            unitsWithoutCost: {type: integer, minimum: 0}
            costValue: {type: [string, 'null'], description: Valor al costo de las unidades con costo; nulo sin purchases:read.}
            unitsWithoutPrice: {type: integer, minimum: 0}
            retailValue: {$ref: '#/components/schemas/CashAmount'}
            currency: {type: string}
        access: {$ref: '#/components/schemas/ExistenceAccess'}
        hasMore: {type: boolean}
    StockBalance:
      type: object
      required: [locationId, variantId, sku, product, onHand, reserved, available, minimum, lowStock, active, currency, costStatus, unitCost, inventoryValue]
      properties:
        locationId: {type: string, format: uuid}
        variantId: {type: string, format: uuid}
        sku: {type: string}
        product: {type: string}
        onHand: {type: integer, minimum: 0}
        reserved: {type: integer, minimum: 0}
        available: {type: integer, minimum: 0}
        minimum: {type: [integer, 'null'], minimum: 0}
        lowStock: {type: boolean}
        active: {type: boolean, description: El producto y la variante están activos.}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        costStatus: {type: string, enum: [known, unknown]}
        unitCost: {type: [string, 'null'], pattern: '^\\d{1,16}\\.\\d{2}$'}
        inventoryValue: {type: [string, 'null'], pattern: '^\\d+\\.\\d{2}$', description: null cuando hay unidades cuyo costo no se conoce.}
    MovementHistoryLocation:
      type: object
      required: [id, name, code, storeName, active]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        code: {type: string}
        storeName: {type: string}
        active: {type: boolean, description: Estado actual de la ubicación.}
        historical: {type: boolean, description: La descripción procede de una copia histórica del documento.}
    MovementHistoryItem:
      allOf:
        - $ref: '#/components/schemas/StockMovement'
        - type: object
          required: [product, size, color, productSnapshot, actorName, location, origin, destination, otherEndHidden, purchaseOrderId, saleNumber]
          properties:
            product: {type: string}
            size: {type: string}
            color: {type: string}
            productSnapshot: {type: boolean, description: Producto y atributos proceden de un documento relacionado.}
            actorName: {type: string, description: Nombre actual del actor.}
            location: {$ref: '#/components/schemas/MovementHistoryLocation'}
            origin:
              oneOf:
                - $ref: '#/components/schemas/MovementHistoryLocation'
                - {type: 'null'}
            destination:
              oneOf:
                - $ref: '#/components/schemas/MovementHistoryLocation'
                - {type: 'null'}
            otherEndHidden: {type: boolean}
            purchaseOrderId: {type: [string, 'null'], format: uuid}
            saleNumber: {type: [string, 'null']}
    StockMovement:
      type: object
      required: [id, locationId, variantId, actorId, sku, type, delta, before, after, reason, createdAt, transferId, countId, saleId, returnId, exchangeId]
      properties:
        id: {type: string, format: uuid}
        locationId: {type: string, format: uuid}
        variantId: {type: string, format: uuid}
        actorId: {type: string, format: uuid}
        sku: {type: string}
        type: {type: string, enum: [adjustment, transfer_dispatch, transfer_receipt, count_adjustment, sale, sale_return, sale_exchange, purchase_receipt]}
        delta: {type: integer, format: int32}
        before: {type: integer, minimum: 0}
        after: {type: integer, minimum: 0}
        reason: {type: string}
        createdAt: {type: string, format: date-time}
        transferId: {type: [string, 'null'], format: uuid}
        countId: {type: [string, 'null'], format: uuid}
        returnId: {type: [string, 'null'], format: uuid}
        exchangeId: {type: [string, 'null'], format: uuid}
        purchaseReceiptId: {type: string, format: uuid}
        saleId: {type: [string, 'null'], format: uuid}
    ProductPhoto:
      type: object
      required: [id, width, height, primary]
      properties:
        id: {type: string, format: uuid}
        width: {type: integer, minimum: 1, maximum: 4096}
        height: {type: integer, minimum: 1, maximum: 4096}
        primary: {type: boolean}
    ClassificationTerm:
      type: object
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    NullableClassificationID:
      type: [string, 'null']
      format: uuid
    PriceList:
      type: object
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    NullablePriceListID:
      type: [string, 'null']
      format: uuid
    PriceAmount:
      type: [string, 'null']
      pattern: '^(0|[1-9][0-9]{0,15})(\.[0-9]{1,2})?$'
      description: Importe decimal exacto devuelto con dos decimales. Null indica que falta el precio.
      examples: ['1250.50', '0.00', null]
    PriceItem:
      type: object
      additionalProperties: false
      required: [amount]
      properties:
        amount: {$ref: '#/components/schemas/PriceAmount'}
    Barcode:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,79}$'
      examples: ['000123']
    Product:
      type: object
      required: [id, name, description, status, categoryId, brandId, revision]
      properties:
        revision: {type: integer, format: int64, minimum: 1}
        id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string}
        status: {type: string, enum: [active, inactive]}
        categoryId: {$ref: '#/components/schemas/NullableClassificationID'}
        brandId: {$ref: '#/components/schemas/NullableClassificationID'}
    VariantBatchInput:
      type: object
      required: [rows]
      description: Cuerpo JSON de hasta 64 KiB.
      properties:
        rows:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            properties:
              size: {$ref: '#/components/schemas/VariantBatchAttribute'}
              color: {$ref: '#/components/schemas/VariantBatchAttribute'}
              sku: {type: string, maxLength: 80, description: Obligatorio en el alta. Vacío en previsualización solicita sugerencia.}
              generateInternal: {type: boolean, default: false}
              status: {type: string, enum: [active, inactive], default: active}
    VariantBatchAttribute:
      oneOf:
        - type: 'null'
        - type: object
          required: [id, revision]
          properties:
            id: {type: string, format: uuid}
            revision: {type: integer, format: int64, minimum: 1}
    VariantBatchIssue:
      type: object
      required: [row, field, code, message]
      properties:
        row: {type: integer, minimum: 1, maximum: 50}
        field: {type: string, enum: [size, color, sku, status, combination, generateInternal]}
        code:
          type: string
          enum: [invalid_field, attribute_changed, attribute_unavailable, attribute_inactive, attribute_combination, batch_duplicate, sku_taken, identifier_retired, identifier_capacity, internal_barcode_unavailable, variant_write_failed]
        message: {type: string}
        existing:
          type: object
          required: [id, sku, status]
          properties:
            id: {type: string, format: uuid}
            sku: {type: string}
            status: {type: string, enum: [active, inactive]}
    VariantBatchError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
            rows:
              type: array
              items: {$ref: '#/components/schemas/VariantBatchIssue'}
    CatalogIdentifierSettings:
      type: object
      required: [skuPrefix, skuWidth, revision]
      properties:
        skuPrefix: {type: string, maxLength: 12}
        skuWidth: {type: integer, minimum: 4, maximum: 12}
        revision: {type: integer, minimum: 1}
    CatalogIdentifierEvent:
      type: object
      required: [value, variantId, action, internal, actorId, reason, createdAt]
      properties:
        value: {type: string}
        variantId: {type: string, format: uuid}
        action: {type: string, enum: [retired, reused]}
        internal: {type: boolean}
        actorId: {type: [string, 'null'], format: uuid}
        reason: {type: string}
        createdAt: {type: string, format: date-time}
    CatalogAttributeData:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 60}
        code: {type: [string, 'null'], maxLength: 60, description: Opcional en talles. En colores se deriva del nombre si se omite. Los grupos carecen de código.}
        position: {type: integer, minimum: 0, maximum: 9999, default: 0}
        status: {type: string, enum: [active, inactive]}
        hex: {type: [string, 'null'], pattern: '^#[0-9a-fA-F]{6}$', description: Solo colores.}
        groupId: {type: [string, 'null'], format: uuid, description: Solo talles.}
    CatalogAttribute:
      allOf:
        - $ref: '#/components/schemas/CatalogAttributeData'
        - type: object
          required: [id, revision, code, position, status, hex, groupId]
          properties:
            id: {type: string, format: uuid}
            revision: {type: integer, format: int64, minimum: 1}
    QuickProductInput:
      type: object
      additionalProperties: false
      required: [product, storeId, variants]
      properties:
        product:
          type: object
          required: [name]
          properties:
            name: {type: string, minLength: 1, maxLength: 160}
            description: {type: string, maxLength: 2000}
            categoryId: {type: [string, 'null'], format: uuid}
            brandId: {type: [string, 'null'], format: uuid}
        storeId: {type: string, format: uuid}
        locationId: {type: string, description: Obligatoria si alguna cantidad es mayor que cero.}
        attributes:
          type: array
          maxItems: 4
          items:
            type: object
            required: [name, role]
            properties:
              name: {type: string, minLength: 1, maxLength: 40}
              role: {type: string, enum: [size, color, option]}
        variants:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [values, barcode]
            properties:
              values: {type: array, items: {type: string, maxLength: 60}, description: 'Un valor por atributo, en el mismo orden.'}
              sku: {type: string, maxLength: 80, description: Vacío para numeración automática.}
              barcode:
                type: object
                required: [mode]
                properties:
                  mode: {type: string, enum: [internal, existing]}
                  code: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,79}$'}
              price: {type: [string, 'null'], description: Importe decimal no negativo; null significa sin precio (distinto de 0).}
              quantity: {type: integer, minimum: 0, maximum: 100000}
    QuickProductResult:
      type: object
      required: [product, variants, attributes, storeId, locationId, priceListId, currency, units]
      properties:
        product: {$ref: '#/components/schemas/Product'}
        attributes: {type: array, items: {type: object}}
        storeId: {type: string, format: uuid}
        locationId: {type: [string, 'null'], format: uuid}
        priceListId: {type: [string, 'null'], format: uuid}
        currency: {type: string}
        units: {type: integer}
        variants:
          type: array
          items:
            type: object
            required: [variant, price, quantity, movementId]
            properties:
              variant: {$ref: '#/components/schemas/Variant'}
              price: {type: [string, 'null']}
              quantity: {type: integer}
              movementId: {type: [string, 'null'], format: uuid}
    VariantOption:
      type: object
      required: [name, value]
      properties:
        name: {type: string}
        value: {type: string}
    Variant:
      type: object
      required: [id, productId, sku, size, color, status, barcodes, revision, sizeId, colorId, internalBarcode, options]
      properties:
        options:
          type: array
          description: Atributos adicionales que forman parte de la identidad de la variante (por ejemplo el largo de un jean). Vacío en variantes anteriores.
          items: {$ref: '#/components/schemas/VariantOption'}
        revision: {type: integer, format: int64, minimum: 1}
        id: {type: string, format: uuid}
        productId: {type: string, format: uuid}
        sku: {type: string}
        size: {type: string}
        color: {type: string}
        status: {type: string, enum: [active, inactive]}
        sizeId: {type: [string, 'null'], format: uuid}
        colorId: {type: [string, 'null'], format: uuid}
        internalBarcode: {type: [string, 'null'], description: 'Código interno Code 128 cuando existe. Los nuevos tienen 16 dígitos (2 + 5 del comercio + 10 de secuencia); los anteriores conservan el formato RI-.'}
        barcodes:
          type: array
          description: El código principal se devuelve primero cuando existe.
          items: {$ref: '#/components/schemas/Barcode'}
    ManagedStore:
      type: object
      required: [id, code, name, address, status]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        address: { type: string }
        status: { type: string, enum: [active, inactive] }
    StaffRole:
      type: string
      enum: [CASHIER, INVENTORY_OPERATOR, STORE_MANAGER]
    StoreAssignments:
      type: array
      minItems: 1
      maxItems: 100
      uniqueItems: true
      items: { type: string, format: uuid }
    ManagedUser:
      type: object
      required: [id, name, email, status, roles, storeIds]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        status: { type: string, enum: [active, inactive] }
        roles:
          type: array
          items: { type: string }
        storeIds:
          type: array
          items: { type: string, format: uuid }
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: retail_session
  responses:
    CatalogIdentifierSettings:
      description: Formato de numeración del comercio.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CatalogIdentifierSettings'}
    CatalogAttribute:
      description: Valor maestro guardado.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CatalogAttribute'}
    Sale:
      description: Venta confirmada o registro original recuperado por reintento.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Sale'}
    CashSession:
      description: Sesión de caja e importes del arqueo.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CashSession'}
    CountConflict:
      description: Estado, clave o revisión en conflicto. count_stale y count_reserved identifican las variantes afectadas.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code: {type: string}
                  message: {type: string}
                  variantIds:
                    type: [array, 'null']
                    items: {type: string, format: uuid}
    StockCount:
      description: Conteo y cantidades por variante.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/StockCount'}
    StockTransfer:
      description: Transferencia y cantidades por variante.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/StockTransfer'}
    ProductPhotoList:
      description: Metadatos de las fotos del producto, con la principal primero.
      content:
        application/json:
          schema:
            type: object
            required: [images]
            properties:
              images:
                type: array
                items: {$ref: '#/components/schemas/ProductPhoto'}
    CatalogCSV:
      description: Archivo CSV UTF-8 con BOM.
      headers:
        Content-Disposition:
          schema: {type: string}
      content:
        text/csv:
          schema:
            type: string
            format: binary
    ClassificationTerm:
      description: Categoría o marca guardada.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ClassificationTerm'}
    PriceItem:
      description: Precio en la lista.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PriceItem'}
    Product:
      description: Producto guardado.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Product'}
    ManagedStore:
      description: Sucursal creada o actualizada.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ManagedStore' }
    ManagedUser:
      description: Usuario creado o actualizado.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ManagedUser' }
    Healthy:
      description: Servicio disponible.
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status: { const: ok }
    SupplierDuplicate:
      description: Ya existe un proveedor con ese nombre o esa identificación fiscal.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message, field, supplier]
                properties:
                  code: {type: string, enum: [supplier_duplicate]}
                  message: {type: string}
                  field: {type: string, enum: [name, taxId]}
                  supplier:
                    type: object
                    required: [id, name]
                    properties:
                      id: {type: string, format: uuid}
                      name: {type: string}
    Error:
      description: Error de API.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code:
                    type: string
                    enum: [invalid_request, invalid_field, revision_conflict, sensitive_history, identifier_retired, barcode_reuse_unsafe, internal_barcode_exists, identifier_capacity, attribute_duplicate, attribute_inactive, attribute_changed, attribute_combination, unauthorized, forbidden, origin_forbidden, rate_limited, internal_error, unavailable, not_found, email_taken, store_code_taken, sku_taken, barcode_taken, price_list_name_taken, classification_name_taken, catalog_csv_limit, unsupported_media_type, photo_size_limit, photo_count_limit, location_code_taken, inventory_balance_conflict, purchase_supplier_unavailable, purchase_variant_unavailable, purchase_receipt_location, purchase_receipt_quantity, purchase_order_closed, supplier_duplicate, return_operation_unsettled, idempotency_conflict, variant_batch_limit, variant_batch_invalid, transfer_state_conflict, transfer_receipt_reason_required, count_stale, count_state_conflict, cash_register_code_taken, cash_register_occupied, cash_session_state_conflict, cash_balance_conflict, sale_location_unavailable, sale_price_missing, sale_price_changed, sale_insufficient_cash, sale_amount_limit, sale_stock_insufficient, return_quantity_exceeded, return_location_unavailable, return_refund_unavailable, return_refund_method_mismatch, return_already_refunded, return_refund_allocation, return_refund_amount, return_debt_credit_amount, return_exchange_unavailable, return_exchange_stock, return_exchange_difference, return_exchange_charge_amount]
                  message: { type: string }
                  field: {type: string, description: Campo inválido si corresponde.}
