openapi: 3.1.0
info:
  title: Retail API
  version: 0.1.0
  description: Identidad, sucursales, catálogo, precios, inventario, caja y punto de venta.
servers:
  - url: http://localhost:5173
    description: Proxy local del frontend.
security:
  - cookieSession: []
paths:
  /api/health/live:
    get:
      operationId: checkLive
      summary: Verificar que el proceso HTTP responde.
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
  /api/health/ready:
    get:
      operationId: checkReady
      summary: Verificar la conexión a PostgreSQL.
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Iniciar sesión con correo y contraseña.
      description: Si las credenciales coinciden en varios comercios, devuelve las opciones de acceso. El campo commerce sigue disponible para clientes anteriores. Si se envía Origin, debe coincidir con el origen configurado.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                commerce: { type: string, maxLength: 80, examples: [demo] }
                email: { type: string, format: email, maxLength: 254, examples: [demo@example.test] }
                password: { type: string, minLength: 1, maxLength: 1024, writeOnly: true }
      responses:
        '200':
          description: Comercios habilitados por las credenciales. El token de selección dura cinco minutos y permite abrir una sola sesión.
          content:
            application/json:
              schema:
                type: object
                required: [token, commerces]
                properties:
                  token: {type: string, minLength: 43, maxLength: 43}
                  commerces:
                    type: array
                    minItems: 2
                    items:
                      type: object
                      required: [id, name, code]
                      properties:
                        id: {type: string, format: uuid}
                        name: {type: string}
                        code: {type: string}
        '204':
          description: Sesión emitida con duración máxima de ocho horas.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: Cookie HttpOnly, SameSite Strict y Secure con HTTPS.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/v1/auth/choose-commerce:
    post:
      operationId: chooseLoginCommerce
      summary: Abrir sesión en uno de los comercios ofrecidos al iniciar sesión.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, commerceId]
              properties:
                token: {type: string, minLength: 43, maxLength: 43, writeOnly: true}
                commerceId: {type: string, format: uuid}
      responses:
        '204':
          description: Sesión emitida para el comercio elegido.
          headers:
            Set-Cookie:
              schema: {type: string}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revocar la sesión y expirar la cookie.
      description: Operación idempotente. Si se envía Origin, debe coincidir con el origen configurado.
      security:
        - cookieSession: []
        - {}
      responses:
        '204':
          description: Sesión cerrada o inexistente.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: Expira la cookie de sesión.
        '403':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/v1/me:
    get:
      operationId: getMe
      summary: Consultar la identidad autenticada.
      responses:
        '200':
          description: Identidad de sesión.
          content:
            application/json:
              schema:
                type: object
                required: [tenantId, userId, name]
                properties:
                  tenantId: { type: string, format: uuid }
                  userId: { type: string, format: uuid }
                  name: { type: string }
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/v1/stores:
    get:
      operationId: listStores
      summary: Listar sucursales activas asignadas al usuario.
      description: Requiere stores:read. Devuelve todas las asignaciones activas ordenadas por código para esta iteración.
      responses:
        '200':
          description: Sucursales del usuario autenticado.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, code, name]
                      properties:
                        id: { type: string, format: uuid }
                        code: { type: string, examples: [CENTRAL] }
                        name: { type: string, examples: [Sucursal central] }
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    post:
      operationId: createStore
      summary: Crear una sucursal activa y asignarla al propietario que la crea.
      description: Requiere stores:manage. Si se envía Origin debe coincidir con el configurado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, name]
              properties:
                code: { type: string, minLength: 1, maxLength: 40 }
                name: { type: string, minLength: 1, maxLength: 160 }
                address: { type: string, maxLength: 300 }
      responses:
        '201':
          $ref: '#/components/responses/ManagedStore'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/v1/stores/admin:
    get:
      operationId: listManagedStores
      summary: Listar sucursales activas e inactivas del comercio.
      description: Requiere stores:manage. El listado inicial no está paginado.
      responses:
        '200':
          description: Sucursales administrables.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ManagedStore' }
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/v1/stores/{id}:
    patch:
      operationId: updateStore
      summary: Editar código, nombre, domicilio o estado.
      description: Requiere stores:manage. Desactivar retira el acceso operativo y conserva asignaciones. Si se envía Origin debe coincidir con el configurado.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                code: { type: string, minLength: 1, maxLength: 40 }
                name: { type: string, minLength: 1, maxLength: 160 }
                address: { type: string, maxLength: 300 }
                status: { type: string, enum: [active, inactive] }
      responses:
        '200':
          $ref: '#/components/responses/ManagedStore'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/v1/users:
    get:
      operationId: listUsers
      summary: Listar usuarios administrables y opciones de alta.
      description: Devuelve usuarios de todo el comercio para OWNER y solo personal con alcance completamente cubierto para STORE_MANAGER. El listado inicial no está paginado.
      responses:
        '200':
          description: Usuarios administrables, sucursales activas disponibles y roles que se pueden asignar al crear.
          content:
            application/json:
              schema:
                type: object
                required: [items, stores, roles, canChangeRoles]
                properties:
                  canChangeRoles: { type: boolean }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ManagedUser' }
                  stores:
                    type: array
                    items:
                      type: object
                      required: [id, code, name]
                      properties:
                        id: { type: string, format: uuid }
                        code: { type: string }
                        name: { type: string }
                  roles:
                    type: array
                    items: { $ref: '#/components/schemas/StaffRole' }
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    post:
      operationId: createUser
      summary: Crear un usuario y asignarle sucursales activas.
      description: OWNER puede crear encargados, cajeros y operadores. STORE_MANAGER puede crear cajeros y operadores dentro de sus sucursales. Si se envía Origin debe coincidir con el configurado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, email, password, role, storeIds]
              properties:
                name: { type: string, minLength: 1, maxLength: 160 }
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, writeOnly: true, description: 'Entre 12 y 1024 bytes.' }
                role: { $ref: '#/components/schemas/StaffRole' }
                storeIds: { $ref: '#/components/schemas/StoreAssignments' }
      responses:
        '201':
          $ref: '#/components/responses/ManagedUser'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/v1/users/{id}:
    patch:
      operationId: updateUser
      summary: Editar nombre, estado, sucursales o rol de un usuario administrable.
      description: storeIds reemplaza todas las asignaciones cuando se incluye. Con role, OWNER reemplaza los roles existentes por el rol indicado. La desactivación y el cambio efectivo de rol revocan las sesiones. Usuarios de otros comercios o fuera del alcance devuelven 404. Si se envía Origin debe coincidir con el configurado.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 160 }
                status: { type: string, enum: [active, inactive] }
                role: { $ref: '#/components/schemas/StaffRole' }
                storeIds: { $ref: '#/components/schemas/StoreAssignments' }
      responses:
        '200':
          $ref: '#/components/responses/ManagedUser'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/v1/catalog/csv/template:
    get:
      operationId: downloadCatalogTemplate
      summary: Descargar la plantilla CSV con ejemplos de variantes.
      responses:
        '200': {$ref: '#/components/responses/CatalogCSV'}
        '401': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/catalog/csv/export:
    get:
      operationId: exportCatalogCSV
      summary: Descargar productos y variantes del comercio.
      description: Requiere catalog:manage. Incluye productos y variantes inactivos.
      responses:
        '200': {$ref: '#/components/responses/CatalogCSV'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/catalog/csv/import:
    post:
      operationId: importCatalogCSV
      summary: Dar de alta productos y variantes desde un CSV UTF-8.
      description: Requiere catalog:manage. La importación acepta coma o punto y coma, hasta 2 MiB y 1000 filas de datos por archivo. Ante un error se revierte el archivo completo.
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Cantidades dadas de alta.
          content:
            application/json:
              schema:
                type: object
                required: [products, variants]
                properties:
                  products: {type: integer, minimum: 1}
                  variants: {type: integer, minimum: 0}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/catalog/classifications:
    get:
      operationId: listCatalogClassifications
      summary: Listar categorías y marcas del comercio.
      responses:
        '200':
          description: Categorías y marcas ordenadas por nombre.
          content:
            application/json:
              schema:
                type: object
                required: [categories, brands]
                properties:
                  categories:
                    type: array
                    items: {$ref: '#/components/schemas/ClassificationTerm'}
                  brands:
                    type: array
                    items: {$ref: '#/components/schemas/ClassificationTerm'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/categories:
    get:
      operationId: listCategories
      summary: Consultar categorías del comercio autenticado.
      responses:
        '200':
          description: Clasificaciones del comercio.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id: {type: string, format: uuid}
                        name: {type: string}
        '401':
          description: Sesión ausente o expirada.
        '403':
          description: Sin permiso de consulta de catálogo.
    post:
      operationId: createCategory
      summary: Crear una categoría del comercio.
      description: Requiere catalog:manage. El nombre es único por comercio sin distinguir mayúsculas.
      requestBody:
        $ref: '#/components/requestBodies/ClassificationName'
      responses:
        '201': {$ref: '#/components/responses/ClassificationTerm'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/categories/{id}:
    patch:
      operationId: updateCategory
      summary: Renombrar una categoría del comercio.
      description: Requiere catalog:manage. El nombre es único por comercio sin distinguir mayúsculas.
      parameters:
        - $ref: '#/components/parameters/ProductID'
      requestBody:
        $ref: '#/components/requestBodies/ClassificationName'
      responses:
        '200': {$ref: '#/components/responses/ClassificationTerm'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/brands:
    get:
      operationId: listBrands
      summary: Consultar marcas del comercio autenticado.
      responses:
        '200':
          description: Clasificaciones del comercio.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id: {type: string, format: uuid}
                        name: {type: string}
        '401':
          description: Sesión ausente o expirada.
        '403':
          description: Sin permiso de consulta de catálogo.
    post:
      operationId: createBrand
      summary: Crear una marca del comercio.
      description: Requiere catalog:manage. El nombre es único por comercio sin distinguir mayúsculas.
      requestBody:
        $ref: '#/components/requestBodies/ClassificationName'
      responses:
        '201': {$ref: '#/components/responses/ClassificationTerm'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/brands/{id}:
    patch:
      operationId: updateBrand
      summary: Renombrar una marca del comercio.
      description: Requiere catalog:manage. El nombre es único por comercio sin distinguir mayúsculas.
      parameters:
        - $ref: '#/components/parameters/ProductID'
      requestBody:
        $ref: '#/components/requestBodies/ClassificationName'
      responses:
        '200': {$ref: '#/components/responses/ClassificationTerm'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/catalog/sku-suggestion:
    get:
      operationId: suggestCatalogSKU
      summary: Consultar un SKU sugerido sin reservarlo.
      description: Requiere catalog:manage. Las consultas concurrentes pueden ofrecer el mismo SKU. El alta valida la asignación definitiva.
      parameters:
        - name: after
          in: query
          description: Ordinal de la oferta anterior para consultar otra.
          schema: {type: integer, minimum: 0, maximum: 999999999999, default: 0}
      responses:
        '200':
          description: Sugerencia sin efectos persistentes.
          content:
            application/json:
              schema:
                type: object
                required: [sku, ordinal]
                properties:
                  sku: {type: string}
                  ordinal: {type: integer, minimum: 1, maximum: 999999999999}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/catalog/identifier-settings:
    get:
      operationId: readCatalogIdentifierSettings
      summary: Consultar el formato de SKU sugerido del comercio.
      responses:
        '200': {$ref: '#/components/responses/CatalogIdentifierSettings'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    patch:
      operationId: configureCatalogIdentifiers
      summary: Cambiar el formato conservando el contador.
      description: Requiere catalog:manage. El prefijo opcional se normaliza a mayúsculas ASCII. El cambio no afecta identificadores asignados.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skuWidth, expectedRevision]
              properties:
                skuPrefix: {type: string, maxLength: 12, pattern: '^([A-Za-z][A-Za-z0-9_-]{0,11})?$'}
                skuWidth: {type: integer, minimum: 4, maximum: 12}
                expectedRevision: {type: integer, minimum: 1}
      responses:
        '200': {$ref: '#/components/responses/CatalogIdentifierSettings'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/catalog/identifier-history:
    get:
      operationId: readCatalogIdentifierHistory
      summary: Consultar retiros y reutilizaciones de un identificador exacto.
      description: Requiere catalog:manage. La respuesta histórica no se utiliza para resolver escaneos operativos.
      parameters:
        - name: kind
          in: query
          required: true
          schema: {type: string, enum: [sku, barcode]}
        - name: value
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 80}
      responses:
        '200':
          description: Hasta 50 eventos del comercio, del más reciente al más antiguo.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/CatalogIdentifierEvent'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/catalog/sizes:
    get:
      operationId: listCatalogSizes
      summary: Listar talles del comercio autenticado, por orden y nombre.
      responses:
        '200':
          description: Valores activos e inactivos del comercio.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/CatalogAttribute'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      operationId: createCatalogSizes
      summary: Crear un valor de talles.
      description: Requiere catalog:manage. Estado inicial activo.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CatalogAttributeData'}
      responses:
        '201': {$ref: '#/components/responses/CatalogAttribute'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/catalog/sizes/{id}:
    patch:
      operationId: updateCatalogSizes
      summary: Editar un valor de talles con revisión independiente.
      description: Reemplaza los datos editables. Requiere catalog:manage. El nombre nuevo no cambia el texto de variantes vinculadas. Una revisión obsoleta devuelve revision_conflict.
      parameters:
        - $ref: '#/components/parameters/ProductID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CatalogAttributeData'
                - type: object
                  required: [expectedRevision, status]
                  properties:
                    expectedRevision: {type: integer, format: int64, minimum: 1}
      responses:
        '200': {$ref: '#/components/responses/CatalogAttribute'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/catalog/colors:
    get:
      operationId: listCatalogColors
      summary: Listar colores del comercio autenticado, por orden y nombre.
      responses:
        '200':
          description: Valores activos e inactivos del comercio.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/CatalogAttribute'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
