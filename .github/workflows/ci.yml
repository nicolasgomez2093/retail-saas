name: Fundaciones
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        ports: ['5432:5432']
        env:
          POSTGRES_USER: retail
          POSTGRES_PASSWORD: retail_test
          POSTGRES_DB: retail_test
        options: >-
          --health-cmd "pg_isready -U retail -d retail_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://retail:retail_test@127.0.0.1:5432/retail_test?sslmode=disable
    steps:
      # Third-party actions are pinned to a full commit; Dependabot proposes updates.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: make check
      - run: make test-db
      - run: docker compose config --quiet
      - run: npx --yes @redocly/cli@1.34.5 lint docs/openapi.yaml --extends minimal
      - name: Vulnerabilidades conocidas en Go
        run: cd apps/api && go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Vulnerabilidades conocidas en npm
        run: npm audit --prefix apps/web --audit-level=moderate
