name: Fundaciones
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        ports: ['5432:5432']
        env:
          POSTGRES_USER: retail
          POSTGRES_PASSWORD: retail_test
          POSTGRES_DB: retail_test
        options: >-
          --health-cmd "pg_isready -U retail -d retail_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://retail:retail_test@127.0.0.1:5432/retail_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: make check
      - run: docker compose config --quiet
      - run: npx --yes @redocly/cli@1.34.5 lint docs/openapi.yaml --extends minimal
